<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eleven Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Eleven Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: dark performance console — fixed left sidebar (brand, season, search, mode chips, sections), page header with tabs, glassy cards on a faint grid with violet glows. */
:root{
  --bg:#0a0c13; --bg-glow1:rgba(59,130,246,.14); --bg-glow2:rgba(56,189,248,.07); --grid:rgba(148,163,255,.035);
  --surface:#11141e; --surface-2:#161a27; --surface-3:#1c2132; --sunk:#0d1018;
  --ink:#e9ebf5; --ink-2:#a6abc2; --muted:#6e7491; --line:rgba(148,163,255,.09); --line-2:rgba(148,163,255,.17);
  --accent:#3b82f6; --accent-2:#60a5fa; --accent-soft:rgba(59,130,246,.17); --accent-ink:#ffffff;
  --st-under:#fab219; --st-ok:#22b45a; --st-over:#e0464a; --st-info:#7c84a3;
  --st-under-bg:rgba(250,178,25,.13); --st-ok-bg:rgba(34,180,90,.14); --st-over-bg:rgba(224,70,74,.15); --st-info-bg:rgba(124,132,163,.14);
  --st-under-ink:#ffc94d; --st-ok-ink:#5ee08e; --st-over-ink:#ff8a8d;
  --vm-grey:#3b4256; --vm-yellow:#8d6c17; --vm-green:#1f7a43; --vm-purple:#5b4bd6;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#9085e9;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --r-s:8px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f4fa; --bg-glow1:rgba(59,130,246,.10); --bg-glow2:rgba(56,189,248,.07); --grid:rgba(60,70,120,.045);
  --surface:#ffffff; --surface-2:#f6f7fc; --surface-3:#eceef7; --sunk:#eef0f7;
  --ink:#161a2b; --ink-2:#4b5170; --muted:#7c829c; --line:rgba(30,40,90,.09); --line-2:rgba(30,40,90,.16);
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:rgba(37,99,235,.10); --accent-ink:#ffffff;
  --st-under-bg:#fdf0cf; --st-ok-bg:#dcf2e2; --st-over-bg:#f9dede; --st-info-bg:#eceef4;
  --st-under-ink:#6b4a00; --st-ok-ink:#0d5c2b; --st-over-ink:#8e1f22;
  --vm-grey:#c8ced8; --vm-yellow:#f1d06a; --vm-green:#7fd09b; --vm-purple:#9d8af0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --shadow:0 1px 2px rgba(20,25,60,.06),0 6px 18px rgba(20,25,60,.05);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f4fa; --bg-glow1:rgba(59,130,246,.10); --bg-glow2:rgba(56,189,248,.07); --grid:rgba(60,70,120,.045);
  --surface:#ffffff; --surface-2:#f6f7fc; --surface-3:#eceef7; --sunk:#eef0f7;
  --ink:#161a2b; --ink-2:#4b5170; --muted:#7c829c; --line:rgba(30,40,90,.09); --line-2:rgba(30,40,90,.16);
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:rgba(37,99,235,.10); --accent-ink:#ffffff;
  --st-under-bg:#fdf0cf; --st-ok-bg:#dcf2e2; --st-over-bg:#f9dede; --st-info-bg:#eceef4;
  --st-under-ink:#6b4a00; --st-ok-ink:#0d5c2b; --st-over-ink:#8e1f22;
  --vm-grey:#c8ced8; --vm-yellow:#f1d06a; --vm-green:#7fd09b; --vm-purple:#9d8af0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --shadow:0 1px 2px rgba(20,25,60,.06),0 6px 18px rgba(20,25,60,.05);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 70% -10%,var(--bg-glow1),transparent 70%),radial-gradient(700px 500px at 0% 100%,var(--bg-glow2),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.num,.mono,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
a{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.reduce *{transition:none!important;animation:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding-block:16px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.brand-mark{width:38px;height:38px;border-radius:10px;display:block;box-shadow:0 4px 14px rgba(59,130,246,.3);flex:none}
.brand b{font-size:16px;font-weight:800;display:block;line-height:1.1;letter-spacing:.06em}
.brand b span{color:var(--accent-2)}
.brand small{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.season{display:flex;gap:6px}
.season select{flex:1;background:var(--accent-soft);border:1px solid var(--line-2);color:var(--accent-2);font-weight:700;border-radius:9px;padding:7px 9px}
.search{position:relative}
.search input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 10px 8px 30px;font-size:13px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.modes{display:flex;flex-wrap:wrap;gap:4px}
.modes button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;width:100%}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent-2)}
.nav button.cta{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 18px rgba(59,130,246,.3);margin-block:4px}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.side-foot button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.side-foot .st{font-size:11px;color:var(--muted);text-align:center;display:flex;gap:6px;align-items:center;justify-content:center}
.side-foot .st i{width:7px;height:7px;border-radius:50%;background:var(--st-ok);display:inline-block}
.side-foot .st.busy i{background:var(--st-under)} .side-foot .st.err i{background:var(--st-over)}
.mtop{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.content{padding-block:22px 70px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1640px;width:100%}
.ph{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ph-t{margin-right:auto;min-width:0}
.ph-t h1{font-size:24px;display:flex;align-items:center;gap:10px}
.ph-t h1 svg{width:20px;height:20px;stroke:var(--accent-2);fill:none;stroke-width:2}
.ph-t p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:760px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.tabs button:hover{color:var(--ink);border-color:var(--line-2)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.28)}
.tabs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.wk{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:10px}
.wk button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1}
.wk button:hover{color:var(--accent-2)}
.wk select{border:0;background:none;font-weight:700;font-size:13.5px;padding:6px 2px;cursor:pointer;max-width:240px}
.wk select option,.inp option,select option{background:var(--surface);color:var(--ink)}

/* ---------- elementi ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15.5px;margin-right:auto;display:flex;align-items:center;gap:8px}
.card-h .sub{font-size:12px;color:var(--muted);width:100%;margin-top:-4px}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:14px;color:var(--muted);font-weight:600}
.kpi small{color:var(--ink-2);font-size:12px}
.kpi.tone-under{border-color:rgba(250,178,25,.35);background:linear-gradient(160deg,var(--st-under-bg),transparent 70%),var(--surface)}
.kpi.tone-ok{border-color:rgba(34,180,90,.35);background:linear-gradient(160deg,var(--st-ok-bg),transparent 70%),var(--surface)}
.kpi.tone-over{border-color:rgba(224,70,74,.35);background:linear-gradient(160deg,var(--st-over-bg),transparent 70%),var(--surface)}
.kpi.tone-acc{border-color:var(--line-2);background:linear-gradient(160deg,var(--accent-soft),transparent 70%),var(--surface)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.stat span{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:block}
.stat b{font-family:var(--f-mono);font-size:14px;font-weight:700;white-space:nowrap}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t td.n{font-family:var(--f-mono);font-size:12.5px}
.t th.n,.t td.n{text-align:right}
.t tr.sum td{font-weight:700;background:var(--surface-2)}
.t tr.grp td{background:var(--sunk);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);padding-block:6px}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t td.name{font-weight:700}
.t td.muted,.muted{color:var(--muted)}
.t .stick{position:sticky;left:0;background:var(--surface);z-index:1}
.t th.stick{z-index:2;background:var(--surface-2)}
.t tr.sum td.stick{background:var(--surface-2)}
.t tr.grp td.stick{background:var(--sunk)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;line-height:1.55;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.under{background:var(--st-under-bg);color:var(--st-under-ink);border-color:rgba(250,178,25,.3)}
.chip.ok{background:var(--st-ok-bg);color:var(--st-ok-ink);border-color:rgba(34,180,90,.3)}
.chip.over{background:var(--st-over-bg);color:var(--st-over-ink);border-color:rgba(224,70,74,.3)}
.chip.info{background:var(--st-info-bg);color:var(--ink-2)}
.cell{display:inline-block;min-width:56px;text-align:right;padding:3px 8px;border-radius:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;border:1px solid transparent}
.cell.under{background:var(--st-under-bg);color:var(--st-under-ink);border-color:rgba(250,178,25,.28)}
.cell.ok{background:var(--st-ok-bg);color:var(--st-ok-ink);border-color:rgba(34,180,90,.28)}
.cell.over{background:var(--st-over-bg);color:var(--st-over-ink);border-color:rgba(224,70,74,.28)}
.cell.info{color:var(--ink-2)}
.cell.none{color:var(--muted);font-weight:500}
.badge{font-size:10.5px;font-weight:800;background:var(--st-over);color:#fff;border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.badge.soft{background:var(--surface-3);color:var(--ink-2)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);text-transform:uppercase}
.tag.acc{background:var(--accent-soft);color:var(--accent-2)}
.tag.match{background:rgba(217,89,38,.16);color:#f39a6b}
.vm{display:inline-block;min-width:46px;text-align:right;padding:2px 7px;border-radius:6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.vm.g{background:var(--vm-grey)} .vm.y{background:var(--vm-yellow)} .vm.gr{background:var(--vm-green)} .vm.p{background:var(--vm-purple);color:#fff}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--accent-2);color:var(--accent-2)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.danger:hover{border-color:var(--st-over);color:var(--st-over)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink-2);border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.flt{display:flex;flex-direction:column;gap:4px}
.flt>span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.inp,select.inp{border:1px solid var(--line-2);background:var(--sunk);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0;color:var(--ink)}
.inp:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ni{width:66px;text-align:right;border:1px solid transparent;background:var(--sunk);border-radius:6px;padding:5px 6px;font-family:var(--f-mono);font-size:12.5px}
input.ni:hover{border-color:var(--line-2)}
input.ni:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ni::placeholder{color:var(--muted);opacity:.8}
input.ni.w{width:80px}
input[type=date].inp{color-scheme:inherit}
.hint{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:4px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 18px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{width:9px;height:9px;border-radius:50%;margin-top:6px;box-shadow:0 0 0 4px rgba(255,255,255,.03)}
.sev.hi{background:var(--st-over)} .sev.md{background:var(--st-under)} .sev.lo{background:var(--st-info)} .sev.gd{background:var(--st-ok)}
.alert b{font-weight:700}
.alert p{margin:1px 0 0;color:var(--ink-2);font-size:12.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mod{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--surface-2);align-content:start}
.mod input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.mod b{font-weight:700}
.mod p{grid-column:2;margin:0;font-size:12.5px;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;display:block;overflow:visible}

function sd(a){a=a.filter(x=>x!=null&&Number.isFinite(x));if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}

function memo(key,fn){if(_cache.has(key))return _cache.get(key);const v=fn();_cache.set(key,v);return v}
function allEntries(){
 if(_flat)return _flat;
 _flat=[];for(const w of Object.values(S.weeks))for(const e of Object.values(w.entries||{}))_flat.push(e);

function matchesOf(pid){return memo('m:'+pid,()=>allEntries().filter(e=>e.p===pid&&e.kind==='match'))}
function availOf(pid,wk){const m=S.weeks[wk]?.avail?.[pid];if(m)return m;const inj=injuryInWeek(pid,wk);if(inj)return (inj.status==='rtp'&&inj.stage>=4)?'diff':(inj.status==='rtp'?'diff':'inf');return 'disp'}
function excluded(pid,wk){return mod('avail')&&['diff','inf'].includes(availOf(pid,wk))}

function val(e,k){if((k==='acc2'||k==='dec2')&&S.settings.accMode==='fasce'){const a=num(e.v?.[k]),b=num(e.v?.[k==='acc2'?'acc3':'dec3']);return a==null?null:a+(b||0)}
 if(k==='rpe'){const r=num(e.v?.rpe);return r!=null?r:(e.kind==='training'?wellOf(e.p,e.date)?.rpe??null:null)}
 if(k==='hsr80'||k==='hsr90')return hsrRel(e,k==='hsr80'?.8:.9);
 if(k==='dpm'){const v=num(e.v?.dpm);if(v!=null)return v;const d=num(e.v?.dist),m=num(e.v?.min);return d!=null&&m?d/m:null}
 if(k==='srpe'){const r=val(e,'rpe'),m=num(e.v?.min);return r!=null&&m!=null?r*m:null}
 if(k==='hsr'){const a=num(e.v?.d2025),b=num(e.v?.d25);return a==null&&b==null?null:(a||0)+(b||0)}
 if(k==='hid'){const a=num(e.v?.acc3),b=num(e.v?.dec3);return a==null&&b==null?null:(a||0)+(b||0)}
 return num(e.v?.[k])}

/* ---------- aggregazioni ---------- */
function aggregate(list){
 if(!list||!list.length)return null;
 const t={n:list.length};
 for(const m of METRICS){
  if(m.agg==='rate')continue;
  const vals=list.map(e=>val(e,m.k)).filter(v=>v!=null);
  if(!vals.length){t[m.k]=null;continue}
  if(m.agg==='sum')t[m.k]=vals.reduce((a,b)=>a+b,0);
  else if(m.agg==='max')t[m.k]=Math.max(...vals);
  else if(m.agg==='wmean'){
   if(mod('pmWeighted')){let w=0,s=0;for(const e of list){const v=val(e,m.k),mi=val(e,'min');if(v!=null&&mi){w+=mi;s+=v*mi}}t[m.k]=w?s/w:mean(vals)}
   else t[m.k]=mean(vals);
  }
 }
 t.dpm=t.min&&t.dist!=null?t.dist/t.min:mean(list.map(e=>val(e,'dpm')));
 const sr=list.map(e=>val(e,'srpe')).filter(v=>v!=null);t.srpe=sr.length?sr.reduce((a,b)=>a+b,0):null;
 return t;
}
function weekTotal(pid,wk){return memo(`wt:${pid}:${wk}`,()=>aggregate(trainings(pid,wk)))}
function meanTotals(list){ // media di più totali/riferimenti
 if(!list.length)return null;const t={n:list.length};
 for(const k of [...METRICS.map(m=>m.k),'srpe'])t[k]=mean(list.map(x=>x?.[k]));
 return t;
}

/* ---------- riferimento partita ---------- */
function reference(pid,wk){
 return memo(`ref:${pid}:${wk}`,()=>{
  const ws=weekStart(wk);
  const prev=matchesOf(pid).filter(e=>(e.date?e.date<ws:e.wk<wk)).slice().reverse();
  if(!prev.length)return null;
  const smart=mod('refSmart'), R=S.settings.ref;
  if(!smart){const e=prev[0];return {v:entryVals(e),src:[e],note:null,mode:'last'}}
  const valid=prev.filter(e=>(val(e,'min')||0)>=(R.minMin||0));
  let pool=valid, note=null;
  if(!pool.length){pool=[prev[0]];note=`Nessuna partita ≥ ${R.minMin}' : uso l’ultima (${fmt(val(prev[0],'min'))}')`}
  else if(valid[0]!==prev[0])note=`Ultima partita (${prev[0].opp||dShort(prev[0].date)}, ${fmt(val(prev[0],'min'))}') sotto i ${R.minMin}' minimi`;
  let src;
  if(R.mode==='last')src=pool.slice(0,1);
  else if(R.mode==='last3')src=pool.slice(0,3);
  else if(R.mode==='peak')src=pool.slice(0,5);
  else src=pool;
  const vals=src.map(e=>{const v=entryVals(e);return R.normalize?normalizeVals(v,R.dur):v});
  let v;
  if(R.mode==='peak'){v={};for(const m of METRICS)v[m.k]=Math.max(...vals.map(x=>x[m.k]??-Infinity));for(const k in v)if(v[k]===-Infinity)v[k]=null}
  else v=meanTotals(vals);
  return {v,src,note,mode:R.mode};
 });
}
function entryVals(e){const o={};for(const m of METRICS)o[m.k]=val(e,m.k);o.srpe=val(e,'srpe');return o}
function normalizeVals(v,dur){const mi=v.min;if(!mi)return v;const o={...v};for(const m of METRICS)if(m.vol&&o[m.k]!=null)o[m.k]=o[m.k]*dur/mi;if(o.srpe!=null)o.srpe=o.srpe*dur/mi;o.min=dur;return o}
function refLabel(r){
 if(!r)return 'nessuna partita precedente';
 const s=r.src;const R=S.settings.ref;
 const base=s.length===1?`${s[0].opp||'Partita'} ${dShort(s[0].date)} · ${fmt(val(s[0],'min'))}'`:`media ${s.length} partite (${s.map(e=>e.opp||dShort(e.date)).join(', ')})`;
 const m=mod('refSmart')?({last:'',last3:'',season:'',peak:'picco · '}[r.mode]):'';
 return m+base+(mod('refSmart')&&R.normalize?` · norm. ${R.dur}'`:'');
}
function bandsFor(k,role){const rb=mod('roleBands')?S.settings.roleBands?.[role]?.[k]:null;return rb||S.settings.bands[k]||null}
function pctOf(t,r,k){if(!t||!r)return null;const a=t[k],b=r[k];if(a==null||!b)return null;return a/b*100}
function status(k,p,role){if(p==null)return 'none';const b=bandsFor(k,role);if(!b)return 'info';if(p<b[0])return 'under';if(p>b[1])return 'over';return 'ok'}
const BANDED=()=>METRICS.filter(m=>S.settings.bands[m.k]);

function groupWeek(wk,filter){
 const ps=players().filter(p=>filter(p)&&weekTotal(p.id,wk)&&!excluded(p.id,wk));
 const tots=ps.map(p=>weekTotal(p.id,wk));
 const withRef=ps.filter(p=>reference(p.id,wk));
 return {ps,total:meanTotals(tots),ref:meanTotals(withRef.map(p=>reference(p.id,wk).v)),nRef:withRef.length};
}

/* ---------- velocità ---------- */
function pb(pid){return memo('pb:'+pid,()=>{const P_=P(pid);let best=null,at=null;for(const e of allEntries())if(e.p===pid){const v=val(e,'vmax');if(v!=null&&(best==null||v>best)){best=v;at=e}}if(P_?.pbManual&&(best==null||P_.pbManual>best))return {v:P_.pbManual,at:null,manual:true};if(P_?.pbPrev&&(best==null||P_.pbPrev>best))return {v:P_.pbPrev,at:null,prev:true};return best==null?null:{v:best,at}})}
function pbBefore(pid,date){let best=null;for(const e of allEntries())if(e.p===pid&&e.date&&e.date<date){const v=val(e,'vmax');if(v!=null&&(best==null||v>best))best=v}return best}
function vmClass(v,pbv){if(v==null||!pbv)return '';const p=v/pbv*100,[a,b,c]=S.settings.vmaxBands;return p>=100?'p':p>c?'p':p>=b?'gr':p>=a?'y':'g'}
function lastSession(pid){const l=allEntries().filter(e=>e.p===pid&&val(e,'vmax')!=null);return l[l.length-1]||null}
function speedExpo(pid,wk){const P_=pb(pid);if(!P_)return null;const thr=S.settings.speedExpo/100*P_.v;const l=allEntries().filter(e=>e.p===pid&&e.wk===wk&&val(e,'vmax')!=null);return {n:l.filter(e=>val(e,'vmax')>=thr).length,max:l.length?Math.max(...l.map(e=>val(e,'vmax'))):null,sessions:l.length}}
function weeksSinceExpo(pid,wk){const P_=pb(pid);if(!P_)return null;const thr=S.settings.speedExpo/100*P_.v;let last=null;for(const e of allEntries())if(e.p===pid&&e.wk<=wk&&val(e,'vmax')>=thr)last=Math.max(last??-99,e.wk);return last==null?null:wk-last}

/* ---------- ACWR / monotonia ---------- */
function loadMetricDef(){const k=S.settings.acwr.metric;return {dist:'Distanza totale',hsr:'HSR >20 km/h',hid:'Acc>3 + Dec<−3',srpe:'sRPE'}[k]||k}
function weekLoad(pid,wk){return memo(`wl:${pid}:${wk}`,()=>{const k=S.settings.acwr.metric;const l=weekEntries(wk).filter(e=>e.p===pid);if(!l.length)return null;const v=l.map(e=>val(e,k)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null})}
function acwr(pid,wk){return memo(`acwr:${pid}:${wk}`,()=>{
 const a=weekLoad(pid,wk);if(a==null)return null;
 const coupled=S.settings.acwr.model==='coupled';
 const ws=coupled?[wk,wk-1,wk-2,wk-3]:[wk-1,wk-2,wk-3,wk-4];
 const c=ws.map(w=>weekLoad(pid,w)).filter(x=>x!=null);
 if(c.length<3)return {a,c:null,r:null,n:c.length};
 const cm=mean(c);return {a,c:cm,r:cm?a/cm:null,n:c.length};
})}
function acwrZone(r){if(r==null)return 'none';if(r<.8)return 'under';if(r<=1.3)return 'ok';if(r<=1.5)return 'mid';return 'over'}
function monotony(pid,wk){return memo(`mono:${pid}:${wk}`,()=>{
 const k=S.settings.acwr.metric;const ws=weekStart(wk);const days=Array(7).fill(0);let any=false;
 for(const e of weekEntries(wk))if(e.p===pid){const d=e.date?Math.round((s2d(e.date)-s2d(ws))/864e5):MD_OFF[e.md]??3;const v=val(e,k);if(v!=null&&d>=0&&d<7){days[d]+=v;any=true}}
 if(!any)return null;const m=mean(days),s=sd(days);const tot=days.reduce((a,b)=>a+b,0);
 const mono=s?m/s:null;return {mono,strain:mono!=null?tot*mono:null,tot,days};
})}

const SAVE={pending:new Map(),timers:new Map(),inflight:new Set(),err:false};
const LS_KEY='loadlab-u16-v1';
const LEGACY_SEASON='2026-27';
function seasonId(){return S.season||S.settings.curSeason||LEGACY_SEASON}
function coll(name){const id=seasonId();return id===LEGACY_SEASON?name:name+'_'+id}
function calDoc(){const id=seasonId();return id===LEGACY_SEASON?'calendar':'calendar_'+id}
function wkPath(wk){return coll('weeks')+'/w'+String(wk).padStart(2,'0')}
function busy(path){return SAVE.pending.has(path)||SAVE.inflight.has(path)}
function markDirty(path,get){if(S.readOnly&&!/^(app\/injuries|notes\/)/.test(path)){toast('Sola lettura: non puoi modificare questi dati.');return}SAVE.pending.set(path,get);clearTimeout(SAVE.timers.get(path));SAVE.timers.set(path,setTimeout(()=>flush(path),550));setSaveUI()}
async function flush(path){
 if(SAVE.inflight.has(path)){SAVE.timers.set(path,setTimeout(()=>flush(path),300));return}
 const get=SAVE.pending.get(path);if(!get)return;SAVE.pending.delete(path);SAVE.inflight.add(path);setSaveUI();
 try{
  if(S.db){const body=get();if(body==null)await S.db.doc(path).delete();else await S.db.doc(path).set(clone(body))}
  else localSave();
  SAVE.err=false;
 }catch(e){SAVE.err=true;toast(e?.code==='quota_exceeded'?'Archivio pieno: elimina dati vecchi o esporta un backup.':e?.code==='invalid_argument'?'Non hai i permessi per modificare questi dati.':'Salvataggio non riuscito, riprovo tra poco.');if(e?.code==='unavailable'){SAVE.pending.set(path,get);SAVE.timers.set(path,setTimeout(()=>flush(path),2500))}}
 finally{SAVE.inflight.delete(path);setSaveUI()}
}

function niceMax(v){if(!v||v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function lineChart(o){
 const W=o.w||640,H=o.h||220,L=48,R=14,T=12,B=28,iw=W-L-R,ih=H-T-B,n=o.labels.length;
 const all=[];o.series.forEach(s=>s.vals.forEach(v=>v!=null&&all.push(v)));if(o.band)o.band.hi.forEach(v=>v!=null&&all.push(v));(o.refY||[]).forEach(r=>all.push(r.y));
 if(!all.length)return `<div class="empty">Nessun dato da mostrare</div>`;
 let yMin=o.yMin??0,yMax,ySt;{const hi=Math.max(...all)*1.03;const r=(hi-yMin)/4,e=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/e;const st=(f<=1?1:f<=2?2:f<=5?5:10)*e;ySt=st;yMin=Math.floor(yMin/st)*st;yMax=yMin+st*Math.max(1,Math.ceil((hi-yMin)/st));}
 const x=i=>L+(n<=1?iw/2:i*iw/(n-1)),y=v=>T+ih-(v-yMin)/(yMax-yMin)*ih;
 let g='';
 {const st=ySt;const k=Math.round((yMax-yMin)/st);for(let i=0;i<=k;i++){const v=yMin+st*i;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.yfmt?o.yfmt(v):fmt(v)}</text>`}}
 const step=Math.ceil(n/12);o.labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
 if(o.band){let seg=[];const segs=[];o.band.lo.forEach((lo,i)=>{const hi=o.band.hi[i];if(lo!=null&&hi!=null)seg.push(i);else if(seg.length){segs.push(seg);seg=[]}});if(seg.length)segs.push(seg);
  for(const s of segs){const pts=s.map(i=>`${x(i)},${y(o.band.hi[i])}`).concat(s.slice().reverse().map(i=>`${x(i)},${y(o.band.lo[i])}`));if(s.length===1){const i=s[0];g+=`<rect x="${x(i)-6}" y="${y(o.band.hi[i])}" width="12" height="${y(o.band.lo[i])-y(o.band.hi[i])}" fill="var(--st-ok)" opacity=".16"/>`}else g+=`<polygon points="${pts.join(' ')}" fill="var(--st-ok)" opacity=".14"/>`}}
 (o.refY||[]).forEach(r=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${r.color||'var(--muted)'}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${y(r.y)-4}" text-anchor="end" style="fill:var(--ink-2)">${esc(r.label)}</text>`});
 for(const s of o.series){let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){if(!s.bridge)pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v);pen=true});
  if(!s.noLine)g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  if(s.dot!==0)s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${s.dot||3.5}" fill="${s.dotColor?.[i]||s.color}" stroke="var(--surface)" stroke-width="1.5"${o.pick&&s.pick?` data-pick="${esc(o.pick(i))}"`:''}/>`})}
 const hw=n<=1?iw:iw/(n-1);
 o.labels.forEach((l,i)=>{const tip=o.tip?o.tip(i):`<b>${esc(l)}</b><br>`+o.series.map(s=>`${esc(s.name)}: ${s.vals[i]==null?'–':(o.yfmt?o.yfmt(s.vals[i]):fmt(s.vals[i]))}`).join('<br>');g+=`<rect x="${x(i)-hw/2}" y="${T}" width="${hw}" height="${ih}" fill="transparent" data-tiph="${esc(tip)}"${o.pick?` data-pick="${esc(o.pick(i))}" style="cursor:pointer"`:''}/>`});
 g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(yMin)}" y2="${y(yMin)}"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'grafico')}">${g}</svg>`;
}
function barChart(o){
 const W=640,H=o.h||220,L=48,R=10,T=12,B=28,iw=W-L-R,ih=H-T-B,n=o.labels.length;
 const all=o.vals.filter(v=>v!=null);if(o.band)o.band.hi.forEach(v=>v!=null&&all.push(v));
 if(!all.length)return `<div class="empty">Nessun dato da mostrare</div>`;
 const yMax=niceMax(Math.max(...all)*1.04),y=v=>T+ih-v/yMax*ih,bw=Math.min(34,iw/n*.62),x=i=>L+(i+.5)*iw/n;
 let g='';
 for(let i=0;i<=4;i++){const v=yMax*i/4;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.yfmt?o.yfmt(v):fmt(v)}</text>`}
 const step=Math.ceil(n/14);
 o.labels.forEach((l,i)=>{
  if(o.band&&o.band.lo[i]!=null){g+=`<rect x="${x(i)-bw/2-5}" y="${y(o.band.hi[i])}" width="${bw+10}" height="${Math.max(1,y(o.band.lo[i])-y(o.band.hi[i]))}" fill="var(--st-ok)" opacity=".15" rx="2"/>`}
  const v=o.vals[i];if(v!=null){const h=Math.max(1,y(0)-y(v));g+=`<path d="M${x(i)-bw/2},${y(0)} v${-(h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} z" fill="${o.colors?.[i]||'var(--accent)'}"/>`}
  if(i%step===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;
  g+=`<rect x="${x(i)-iw/n/2}" y="${T}" width="${iw/n}" height="${ih}" fill="transparent" data-tiph="${esc(o.tip?o.tip(i):l+': '+fmt(v))}"/>`;
 });
 g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'grafico a barre')}">${g}</svg>`;
}
function radarChart(o){
 const W=340,H=300,cx=W/2,cy=H/2+4,R=106,n=o.axes.length;
 const max=niceMax(Math.max(o.ring||0,...o.series.flatMap(s=>s.vals.filter(v=>v!=null)))*1.05);
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=Math.max(0,Math.min(v,max))/max*R;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let g='';
 for(let k=1;k<=4;k++){const pts=o.axes.map((_,i)=>pt(i,max*k/4).join(',')).join(' ');g+=`<polygon points="${pts}" fill="none" class="gl"/>`}
 if(o.ring){const pts=o.axes.map((_,i)=>pt(i,o.ring).join(',')).join(' ');g+=`<polygon points="${pts}" fill="none" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width="1.2"/>`}
 o.axes.forEach((a,i)=>{const [x2,y2]=pt(i,max);const [lx,ly]=pt(i,max*1.2);g+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><text x="${lx}" y="${ly+4}" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}" style="fill:var(--ink-2);font-weight:600">${esc(a)}</text>`});
 g+=`<text x="${cx+5}" y="${cy-R+12}" style="font-size:10px">${o.yfmt?o.yfmt(max):fmt(max)}</text>`;
 for(const s of o.series){const pts=s.vals.map((v,i)=>pt(i,v??0).join(',')).join(' ');g+=`<polygon points="${pts}" fill="${s.color}" fill-opacity=".10" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
  s.vals.forEach((v,i)=>{const [x,y]=pt(i,v??0);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5" data-tiph="${esc(`<b>${s.name}</b><br>${o.axes[i]}: ${v==null?'–':(o.yfmt?o.yfmt(v):fmt(v))}`)}"/>`})}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:380px;margin:0 auto" role="img" aria-label="${esc(o.aria||'radar')}">${g}</svg>`;
}
const SERIES=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)'];
const ST_COL={under:'var(--st-under)',ok:'var(--st-ok)',over:'var(--st-over)',info:'var(--accent)',none:'var(--line-2)',mid:'var(--st-under)'};
function legend(items){return `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`}
const AFTER={};

/* ---------- helper tabelle ---------- */
function metricHead(list,extra=''){return list.map(m=>`<th class="n" title="${esc(m.l)}">${esc(m.s)}</th>`).join('')+extra}
function valsRow(t,list){return list.map(m=>`<td class="n">${t?fmtM(m.k,t[m.k]):'–'}</td>`).join('')}
function pctRow(t,r,list,role){return list.map(m=>{const p=pctOf(t,r,m.k);return `<td class="n">${S.settings.bands[m.k]||m.k==='vmax'||m.k==='min'||m.k==='dpm'||m.k==='pm'?(bandsFor(m.k,role)?cellPct(m.k,p,role):`<span class="cell info">${pctTxt(p)}</span>`):''}</td>`}).join('')}
function semRow(t,r,list,role){return list.map(m=>{const p=pctOf(t,r,m.k);const st=bandsFor(m.k,role)?status(m.k,p,role):(p==null?'none':'info');return `<td class="n">${st==='none'?'<span class="muted">–</span>':chip(st)}</td>`}).join('')}
function groupTable(g,role,opts={}){
 const list=METRICS;
 const rows=(opts.players||[]).map(p=>{const t=weekTotal(p.id,S.ui.wk);const ex=excluded(p.id,S.ui.wk);return `<tr class="click" data-player="${p.id}"><td class="name stick">${esc(p.name)}${ex?` <span class="tag">${esc(AVAIL_L[availOf(p.id,S.ui.wk)])}</span>`:''}</td>${t?valsRow(t,list):`<td colspan="${list.length}" class="muted">nessun dato GPS in settimana</td>`}</tr>`}).join('');
 return `<div class="tw"><table class="t"><thead><tr><th class="stick">${opts.first||'Parametro'}</th>${metricHead(list)}</tr></thead><tbody>
 ${rows}
 <tr class="sum"><td class="stick">${opts.meanLbl||'Media settimana'}${g.ps.length?` <span class="muted">(${g.ps.length})</span>`:''}</td>${valsRow(g.total,list)}</tr>
 <tr><td class="stick muted">Riferimento partita${g.nRef?` <span class="muted">(${g.nRef})</span>`:''}</td>${valsRow(g.ref,list).replaceAll('<td class="n">','<td class="n muted">')}</tr>
 <tr><td class="stick muted">% su partita</td>${pctRow(g.total,g.ref,list,role)}</tr>
 <tr><td class="stick muted">Semaforo</td>${semRow(g.total,g.ref,list,role)}</tr>
 </tbody></table></div>`;
}
function bandsRow(){return `<tr><td class="stick muted">Fascia ottimale</td>${METRICS.map(m=>{const b=S.settings.bands[m.k];return `<td class="n muted">${b?b[0]+'–'+b[1]+'%':''}</td>`}).join('')}</tr>`}

/* ================= VISTA: SETTIMANA ================= */
const VIEWS={};
VIEWS.week=()=>{
 const wk=S.ui.wk,g=teamWeek(wk);const all=players();
 const withData=all.filter(p=>weekTotal(p.id,wk));
 const pd=withData.map(p=>status('dist',pctOf(weekTotal(p.id,wk),reference(p.id,wk)?.v,'dist'),p.role));
 const okN=pd.filter(s=>s==='ok').length,unN=pd.filter(s=>s==='under').length,ovN=pd.filter(s=>s==='over').length;
 const tp=pctOf(g.total,g.ref,'dist');
 const alerts=mod('alerts')?alertsFor(wk):[];
 if(!withData.length&&!weekEntries(wk).length){
  return `<div class="card"><div class="empty"><b>Nessun dato GPS in questa settimana</b>Inserisci le sedute da <button class="btn sm" data-nav="entry">Inserimento</button>${mod('import')?` oppure carica il file del GPS da <button class="btn sm" data-nav="import">Import GPS</button>`:''}</div></div>`+(mod('alerts')&&alerts.length?alertsCard(alerts):'');
 }
 return `
 <section class="kpis">
  <div class="kpi"><span>Giocatori con dati</span><b>${withData.length}<small style="font-size:16px;color:var(--muted)"> / ${all.length}</small></b><small>${trainingsCount(wk)} sedute registrate</small></div>
  <div class="kpi"><span>Distanza squadra</span><b>${pctTxt(tp)}</b><small>della partita · fascia ${S.settings.bands.dist.join('–')}%</small></div>
  <div class="kpi"><span>In fascia (distanza)</span><b style="color:var(--st-ok-ink)">${okN}</b><small>${unN} sottocarico · ${ovN} da monitorare</small></div>
  <div class="kpi"><span>Media settimanale</span><b>${fmt(g.total?.dist)}<small style="font-size:16px;color:var(--muted)"> m</small></b><small>${fmt(g.total?.min)}' · ${fmt(g.total?.dpm,1)} m/min</small></div>
 </section>
 ${mod('alerts')?alertsCard(alerts):''}
 <section class="card"><div class="card-h"><h2>Media squadra</h2><span class="hint">media dei ${g.ps.length} giocatori con dati${mod('avail')?' (esclusi differenziati e infortunati)':''}</span></div>
  <div class="card-b flush">${groupTable(g,null).replace('</tbody>',bandsRow()+'</tbody>')}</div></section>
 <section class="card"><div class="card-h"><h2>Giocatori della settimana</h2>${mod('board')?'<button class="btn sm" data-nav="board">Semaforo completo</button>':''}</div>
  <div class="card-b flush">${playersWeekTable(wk)}</div></section>`;
};
function trainingsCount(wk){return weekEntries(wk).filter(e=>e.kind==='training').length}
function playersWeekTable(wk){
 const keys=['dist','d2025','d25','acc3','dec3'];
 let h=`<div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th><th>Ruolo</th><th class="n">Sedute</th><th class="n">Distanza</th>${keys.map(k=>`<th class="n">% ${esc(MK[k].s)}</th>`).join('')}<th class="n">Vmax</th>${mod('acwr')?'<th class="n">ACWR</th>':''}<th>Riferimento</th></tr></thead><tbody>`;
 for(const p of players()){const t=weekTotal(p.id,wk);if(!t)continue;const r=reference(p.id,wk);const pbv=pb(p.id)?.v;const a=mod('acwr')?acwr(p.id,wk):null;
  h+=`<tr class="click" data-player="${p.id}"><td class="name stick">${esc(p.name)}</td><td>${roleTag(p.role)}</td><td class="n">${t.n}</td><td class="n">${fmt(t.dist)}</td>${keys.map(k=>`<td class="n">${cellPct(k,pctOf(t,r?.v,k),p.role)}</td>`).join('')}<td class="n"><span class="vm ${vmClass(t.vmax,pbv)}">${fmt(t.vmax,1)}</span></td>${mod('acwr')?`<td class="n">${acwrCell(a)}</td>`:''}<td class="muted" style="font-size:12px">${esc(refLabel(r))}${r?.note?` <span data-tip="${esc(r.note)}">⚠︎</span>`:''}</td></tr>`}
 return h+'</tbody></table></div>';
}
function acwrCell(a){if(!a)return '<span class="muted">–</span>';if(a.r==null)return `<span class="muted" data-tip="Servono almeno 4 settimane di dati per un ACWR affidabile">n.d.</span>`;const z=acwrZone(a.r);const cls=z==='mid'?'under':z;return `<span class="cell ${cls}" data-tip="Acuto ${fmt(a.a)} · cronico ${fmt(a.c)} (${loadMetricDef()})">${fmt(a.r,2)}</span>`}
function alertsCard(list){
 return `<section class="card"><div class="card-h"><h2>Alert della settimana</h2><span class="badge ${list.some(a=>a.sev==='hi')?'':'soft'}">${list.length}</span></div>
 <div>${list.length?list.slice(0,S.ui.allAlerts?99:6).map(a=>`<div class="alert"><span class="sev ${a.sev}"></span><div><b>${esc(a.t)}</b><p>${esc(a.d)}</p></div>${a.p?`<button class="btn sm ghost" data-player="${a.p}">Apri</button>`:''}</div>`).join(''):'<div class="empty">Nessun alert: tutto nelle fasce.</div>'}${list.length>6?`<div style="padding:8px 16px;border-top:1px solid var(--line)"><button class="btn sm ghost" data-allalerts="1">${S.ui.allAlerts?'Mostra meno':'Mostra tutti ('+list.length+')'}</button></div>`:''}</div></section>`;
}
function alertsForBase(wk){return memo('alertsB:'+wk,()=>{
 const out=[];const anyData=trainingsCount(wk)>0;const live=d2s(new Date())<=addDays(weekStart(wk),5)&&d2s(new Date())>=weekStart(wk);let liveUnder=0;const noData=[];
 for(const p of players()){
  const t=weekTotal(p.id,wk),r=reference(p.id,wk);
  if(t&&r&&!excluded(p.id,wk)){
   const un=[],ov=[];for(const m of BANDED()){const st=status(m.k,pctOf(t,r.v,m.k),p.role);if(st==='under')un.push(m.s);if(st==='over')ov.push(m.s)}
   if(ov.length)out.push({sev:ov.includes('Dist')||ov.length>=3?'hi':'md',p:p.id,t:`${p.name}: da monitorare`,d:`Sopra la fascia su ${ov.join(', ')} rispetto a ${refLabel(r)}.`});
   if(live){if(un.length)liveUnder++}else if(un.length>=3||un.includes('Dist'))out.push({sev:'md',p:p.id,t:`${p.name}: sottocarico`,d:`Sotto la fascia su ${un.join(', ')}.`});
   if(r.note)out.push({sev:'lo',p:p.id,t:`${p.name}: riferimento da verificare`,d:r.note});
  }
  if(mod('acwr')){const a=acwr(p.id,wk);if(a?.r!=null){if(a.r>1.5)out.push({sev:'hi',p:p.id,t:`${p.name}: ACWR ${fmt(a.r,2)}`,d:`Picco di carico rispetto al suo abituale (EWMA 7/28 gg, ${loadMetricDef()}).`});else if(a.r>1.3)out.push({sev:'md',p:p.id,t:`${p.name}: ACWR ${fmt(a.r,2)}`,d:'Zona di attenzione 1,3–1,5.'});else if(a.r<.8)out.push({sev:'lo',p:p.id,t:`${p.name}: ACWR ${fmt(a.r,2)}`,d:'Carico basso rispetto al cronico: attenzione al rientro su carichi alti.'})}}
  if(mod('monotony')){const m=monotony(p.id,wk);if(m?.mono!=null&&m.mono>2)out.push({sev:'md',p:p.id,t:`${p.name}: monotonia ${fmt(m.mono,2)}`,d:'Carichi giornalieri molto simili tra loro (soglia 2,0).'})}
  if(mod('speed')&&t){const w=weeksSinceExpo(p.id,wk);const P_=pb(p.id);if(P_&&w!=null&&w>=2)out.push({sev:'md',p:p.id,t:`${p.name}: ${w} settimane senza velocità ≥${S.settings.speedExpo}% PB`,d:`Soglia ${fmt(P_.v*S.settings.speedExpo/100,1)} km/h (PB ${fmt(P_.v,1)}).`});
   const prev=pbBefore(p.id,weekStart(wk));if(prev!=null&&t.vmax>prev)out.push({sev:'gd',p:p.id,t:`${p.name}: nuovo PB ${fmt(t.vmax,1)} km/h`,d:`Precedente ${fmt(prev,1)} km/h.`})}
  if(anyData&&!live&&!t&&!['inf','mal','naz'].includes(availOf(p.id,wk))&&!p.noGps)noData.push(p.name);
 }
 if(noData.length)out.push({sev:'lo',t:`${noData.length} giocatori senza dati GPS`,d:noData.join(', ')});
 if(live&&liveUnder)out.push({sev:'lo',t:`Settimana in corso: ${liveUnder} giocatori ancora sotto fascia`,d:mod('planner')?'Normale a metà settimana: in “Cosa manca” trovi quanto resta per ognuno.':'Normale a metà settimana.'});
 const o={hi:0,md:1,gd:2,lo:3};return out.sort((a,b)=>o[a.sev]-o[b.sev]);
})}

/* ================= VISTA: SEMAFORO ================= */
VIEWS.board=()=>{
 const wk=S.ui.wk;const bm=BANDED();
 let h=`<section class="card"><div class="card-h"><h2>Semaforo per giocatore</h2>${legend([['var(--st-under)','Sottocarico'],['var(--st-ok)','Ottimale'],['var(--st-over)','Da monitorare']])}<span class="sub">% del totale settimanale sulla partita di riferimento di ogni giocatore. Clic sul nome per il profilo.</span></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th>${mod('avail')?'<th>Stato</th>':''}<th class="n">Sed.</th>${bm.map(m=>`<th class="n" title="${esc(m.l)}">${esc(m.s)}</th>`).join('')}<th class="n">Vmax %PB</th>${mod('acwr')?'<th class="n">ACWR</th>':''}${mod('monotony')?'<th class="n">Monot.</th>':''}<th>Riferimento</th></tr></thead><tbody>`;
 for(const r of ROLES){const ps=players().filter(p=>p.role===r.id);if(!ps.length)continue;
  h+=`<tr class="grp"><td class="stick" colspan="1">${r.l}</td><td colspan="${bm.length+6}"></td></tr>`;
  for(const p of ps){const t=weekTotal(p.id,wk),ref=reference(p.id,wk),pbv=pb(p.id)?.v;
   h+=`<tr><td class="name stick"><a href="#" data-player="${p.id}" style="color:inherit;text-decoration:none">${esc(p.name)}</a></td>${mod('avail')?`<td>${availSelect(p.id,wk)}</td>`:''}<td class="n">${t?t.n:'<span class="muted">0</span>'}</td>${bm.map(m=>`<td class="n">${t?cellPct(m.k,pctOf(t,ref?.v,m.k),p.role):'<span class="cell none">–</span>'}</td>`).join('')}<td class="n">${t&&pbv?`<span class="vm ${vmClass(t.vmax,pbv)}">${fmt(t.vmax/pbv*100,0)}%</span>`:'–'}</td>${mod('acwr')?`<td class="n">${acwrCell(acwr(p.id,wk))}</td>`:''}${mod('monotony')?`<td class="n">${monoCell(monotony(p.id,wk))}</td>`:''}<td class="muted" style="font-size:12px">${t?esc(refLabel(ref)):''}</td></tr>`}}
 return h+'</tbody></table></div></div></section>';
};
function availSelect(pid,wk){return `<select class="inp" data-avail="${pid}" style="padding:2px 4px;font-size:12px">${AVAIL.map(a=>`<option value="${a.id}" ${availOf(pid,wk)===a.id?'selected':''}>${a.l}</option>`).join('')}</select>`}
function monoCell(m){if(!m||m.mono==null)return '<span class="muted">–</span>';return `<span class="cell ${m.mono>2?'over':'info'}" data-tip="Strain ${fmt(m.strain)}">${fmt(m.mono,2)}</span>`}

/* ================= VISTA: COSA MANCA ================= */
VIEWS.planner=()=>{
 const wk=S.ui.wk;const keys=BANDED().map(m=>m.k);
 let h=`<div class="note">Per ogni giocatore: quanto ha già fatto in settimana rispetto alla fascia ottimale calcolata sulla sua partita di riferimento. La barra va da 0 alla soglia alta, la tacca segna la soglia bassa. Le sedute rimaste contano le sedute standard (${STD_WEEK.join(', ')}) non ancora registrate.</div>
 <section class="card"><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th><th class="n">Sedute rimaste</th>${keys.map(k=>`<th title="${esc(MK[k].l)}">${esc(MK[k].s)}</th>`).join('')}</tr></thead><tbody>`;
 let any=false;
 for(const r of ROLES){const ps=players().filter(p=>p.role===r.id&&reference(p.id,wk));if(!ps.length)continue;
  h+=`<tr class="grp"><td class="stick">${r.l}</td><td colspan="${keys.length+1}"></td></tr>`;
  for(const p of ps){any=true;const t=weekTotal(p.id,wk)||{},ref=reference(p.id,wk);const done=new Set(trainings(p.id,wk).map(e=>e.md));const left=STD_WEEK.filter(m=>!done.has(m)).length;
   h+=`<tr><td class="name stick"><a href="#" data-player="${p.id}" style="color:inherit;text-decoration:none">${esc(p.name)}</a></td><td class="n">${left}</td>${keys.map(k=>plannerCell(k,t[k]||0,ref.v[k],left,p.role)).join('')}</tr>`}}
 if(!any)h+=`<tr><td colspan="${keys.length+2}"><div class="empty"><b>Nessuna partita di riferimento</b>Il calcolo parte dalla partita giocata prima di questa settimana.</div></td></tr>`;
 return h+'</tbody></table></div></div></section>';
};
function plannerCell(k,done,ref,left,role){
 const b=bandsFor(k,role);if(!b||!ref)return '<td class="muted">–</td>';
 const lo=ref*b[0]/100,hi=ref*b[1]/100,st=done<lo?'under':done>hi?'over':'ok';
 const w=Math.min(100,done/hi*100),mk=lo/hi*100;
 const u=MK[k].u==='m'?' m':'';
 let txt=st==='under'?`mancano ${fmt(lo-done)}${u}`:st==='ok'?`ok · margine ${fmt(hi-done)}${u}`:`oltre di ${fmt(done-hi)}${u}`;
 let sub=st==='under'&&left?`≈ ${fmt((lo-done)/left)}${u} per seduta`:st==='ok'&&left?`max ${fmt((hi-done)/left)}${u} per seduta`:'';
 return `<td style="min-width:150px" data-tip="${esc(`${MK[k].l}: fatto ${fmt(done)} · fascia ${fmt(lo)}–${fmt(hi)}`)}"><div class="bar-mini" style="margin-bottom:4px"><i style="width:${w}%;background:${ST_COL[st]}"></i><span style="position:absolute;left:${mk}%;top:0;bottom:0;width:2px;background:var(--ink-2)"></span></div><div style="font-size:12px;font-weight:600">${txt}</div>${sub?`<div class="muted" style="font-size:11.5px">${sub}</div>`:''}</td>`;
}

VIEWS.trend=()=>{
 const ws=weeksWithData().filter(w=>w>=1);const sel=S.ui.trendMetrics;
 const pills=[...METRICS.filter(m=>m.k!=='min'),...(mod('rpe')?[SRPE_M]:[])].map(m=>`<button class="pill" data-trend="${m.k}" aria-pressed="${sel.includes(m.k)}">${esc(m.s)}</button>`).join('');
 if(!ws.length)return `<div class="card"><div class="empty"><b>Nessuna settimana con dati</b></div></div>`;
 const labels=ws.map(w=>'S'+w);
 const charts=sel.map(k=>{const m=MK[k]||SRPE_M;const tv=ws.map(w=>teamWeek(w).total?.[k]??null),rv=ws.map(w=>teamWeek(w).ref?.[k]??null);const b=S.settings.bands[k];
  const pv=ws.map((w,i)=>tv[i]!=null&&rv[i]?tv[i]/rv[i]*100:null);
  return `<section class="card"><div class="card-h"><h2>${esc(m.l)}</h2><span class="hint">media squadra per settimana${b?' · area verde = fascia '+b.join('–')+'% della partita':''}</span></div><div class="card-b">${lineChart({labels,aria:m.l,series:[{name:'Media settimana',color:'var(--s1)',vals:tv,dotColor:b?ws.map((w,i)=>ST_COL[status(k,pv[i])]):null},{name:'Riferimento partita',color:'var(--s2)',vals:rv,dot:2.5}],band:b?{lo:rv.map(v=>v!=null?v*b[0]/100:null),hi:rv.map(v=>v!=null?v*b[1]/100:null)}:null,yfmt:v=>fmt(v,m.d),tip:i=>`<b>Settimana ${ws[i]}</b><br>Media: ${fmtM(k,tv[i])} ${m.u}<br>Riferimento: ${fmtM(k,rv[i])}<br>${pctTxt(pv[i])} della partita`})}${legend([['var(--s1)','Media settimana (squadra)'],['var(--s2)','Media partite di riferimento']])}</div></section>`}).join('');
 const tbl=`<section class="card"><div class="card-h"><h2>Tabella settimane</h2></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Settimana</th><th class="n">Gioc.</th>${sel.map(k=>`<th class="n">${esc((MK[k]||SRPE_M).s)}</th><th class="n">%</th>`).join('')}</tr></thead><tbody>${ws.map(w=>{const g=teamWeek(w);return `<tr><td class="stick">${esc(wkLabel(w))}</td><td class="n">${g.ps.length}</td>${sel.map(k=>`<td class="n">${fmtM(k,g.total?.[k])}</td><td class="n">${MK[k]&&S.settings.bands[k]?cellPct(k,pctOf(g.total,g.ref,k)):pctTxt(pctOf(g.total,g.ref,k))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div></section>`;
 return `<div class="row"><span class="hint">Parametri:</span><div class="pill-row">${pills}</div></div><div class="grid g2">${charts}</div>${tbl}`;

VIEWS.speed=()=>{
 const wk=S.ui.wk;const [a,b,c]=S.settings.vmaxBands;
 let h=`<section class="card"><div class="card-h"><h2>Storico velocità massima</h2>${legend([['var(--vm-grey)',`<${a}% PB`],['var(--vm-yellow)',`${a}–${b}%`],['var(--vm-green)',`${b}–${c}%`],['var(--vm-purple)',`>${c}% / nuovo PB`]])}<span class="sub">Il PB si aggiorna da solo con allenamenti e partite.${mod('speed')?` Esposizione = sedute della settimana selezionata con Vmax ≥ ${S.settings.speedExpo}% del PB.`:''}</span></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th><th>Ruolo</th><th class="n">PB km/h</th><th>Quando</th><th class="n">95%</th><th class="n">90%</th><th class="n">85%</th><th class="n">80%</th><th class="n">Ultima sess.</th><th class="n">% PB</th>${mod('speed')?`<th class="n">Max sett.</th><th class="n">Sedute ≥${S.settings.speedExpo}%</th><th class="n">Sett. da ultima esp.</th>`:''}</tr></thead><tbody>`;

/* ================= VISTA: ACWR / MONOTONIA ================= */
VIEWS.load=()=>{
 const wk=S.ui.wk;const A=S.settings.acwr;
 const opts=[['dist','Distanza totale'],['hsr','HSR >20 km/h'],['hid','Acc>3 + Dec<−3'],...(mod('rpe')?[['srpe','sRPE']]:[])];
 const ws=weeksWithData().filter(w=>w>=1&&w<=wk);
 const med=ws.map(w=>{const r=players().map(p=>acwr(p.id,w)?.r).filter(x=>x!=null).sort((a,b)=>a-b);return r.length?r[Math.floor(r.length/2)]:null});
 let h=`<section class="card"><div class="card-h"><h2>Impostazioni carico</h2>
 <label class="field" style="flex-direction:row;align-items:center;gap:6px">Parametro <select class="inp" data-set="acwr.metric">${opts.map(([k,l])=>`<option value="${k}" ${A.metric===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="field" style="flex-direction:row;align-items:center;gap:6px">Cronico <select class="inp" data-set="acwr.model"><option value="uncoupled" ${A.model==='uncoupled'?'selected':''}>4 settimane precedenti (uncoupled)</option><option value="coupled" ${A.model==='coupled'?'selected':''}>4 settimane inclusa la corrente (coupled)</option></select></label>
 <span class="sub">Carico settimanale = somma di allenamenti e partita della settimana (lun–dom). L’ACWR è un indicatore di supporto: utile per vedere picchi improvvisi, non predice da solo gli infortuni.</span></div>
 ${mod('acwr')&&ws.length?`<div class="card-b">${lineChart({labels:ws.map(w=>'S'+w),aria:'ACWR mediano squadra',series:[{name:'ACWR mediano squadra',color:'var(--s1)',vals:med}],band:{lo:ws.map(()=>.8),hi:ws.map(()=>1.3)},refY:[{y:1.5,label:'1,5',color:'var(--st-over)'}],yfmt:v=>fmt(v,1),h:200,w:1200})}<div class="hint">ACWR mediano della squadra per settimana · area verde = 0,8–1,3</div></div>`:''}</section>
 <section class="card"><div class="card-h"><h2>${esc(wkLabel(wk))}</h2></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th><th>Ruolo</th><th class="n">Carico sett.</th>${mod('acwr')?'<th class="n">Cronico</th><th class="n">ACWR</th><th>Zona</th>':''}${mod('monotony')?'<th class="n">Monotonia</th><th class="n">Strain</th><th>Carico giornaliero (lun→dom)</th>':''}</tr></thead><tbody>`;
 for(const p of players()){const a=acwr(p.id,wk),m=monotony(p.id,wk);const l=weekLoad(p.id,wk);if(l==null&&!a)continue;const z=acwrZone(a?.r);
  h+=`<tr class="click" data-player="${p.id}"><td class="name stick">${esc(p.name)}</td><td>${roleTag(p.role)}</td><td class="n">${fmt(l)}</td>${mod('acwr')?`<td class="n">${fmt(a?.c)}</td><td class="n">${acwrCell(a)}</td><td>${a?.r==null?'<span class="muted">dati insufficienti</span>':chip(z==='mid'?'under':z,{under:'Basso <0,8',ok:'0,8–1,3',mid:'Attenzione',over:'Picco >1,5'}[z])}</td>`:''}${mod('monotony')?`<td class="n">${monoCell(m)}</td><td class="n">${fmt(m?.strain)}</td><td>${m?spark(m.days):''}</td>`:''}</tr>`}
 return h+'</tbody></table></div></div></section>';
};
function spark(days){const mx=Math.max(...days,1);return `<svg width="112" height="24" viewBox="0 0 112 24" role="img" aria-label="carico giornaliero">${days.map((v,i)=>`<rect x="${i*16+1}" y="${23-Math.max(v?2:0,v/mx*22)}" width="12" height="${Math.max(v?2:0,v/mx*22)}" rx="2" fill="var(--accent)"><title>${['lun','mar','mer','gio','ven','sab','dom'][i]}: ${fmt(v)}</title></rect>`).join('')}<line x1="0" x2="112" y1="23.5" y2="23.5" stroke="var(--line-2)"/></svg>`}

function inputCols(){return [...METRICS,...(mod('rpe')?[RPE_M]:[])]}
VIEWS.entry=()=>{
 const m=S.ui.entryMode;
 const seg=`<div class="seg" role="group"><button data-emode="player" aria-pressed="${m==='player'}">Per giocatore</button><button data-emode="session" aria-pressed="${m==='session'}">Seduta di squadra</button><button data-emode="match" aria-pressed="${m==='match'}">Partita</button></div>`;
 return `<div class="row">${seg}<span class="hint">I dati si salvano da soli mentre scrivi. Dist/min si calcola da sola se lasci vuoto.</span></div>`+(m==='player'?entryPlayer():m==='session'?entrySession():entryMatch());
};
function entryPlayer(){
 const wk=S.ui.wk;const ps=players();if(!ps.length)return '<div class="card"><div class="empty"><b>Aggiungi prima i giocatori</b><button class="btn" data-nav="roster">Vai alla rosa</button></div></div>';
 if(!S.ui.player||!P(S.ui.player))S.ui.player=ps[0].id;const p=P(S.ui.player);const idx=ps.findIndex(x=>x.id===p.id);
 const list=trainings(p.id,wk);const cols=inputCols();const pbv=pb(p.id)?.v;
 const have=new Set(list.map(e=>e.md));
 let h=`<section class="card"><div class="card-h"><div class="row" style="margin-right:auto"><button class="btn sm" data-pnav="${ps[(idx-1+ps.length)%ps.length].id}" aria-label="Giocatore precedente">‹</button><select class="inp" id="entryPlayer" style="font-weight:600;font-size:14px">${ROLES.map(r=>{const g=ps.filter(x=>x.role===r.id);return g.length?`<optgroup label="${r.l}">${g.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}${weekTotal(x.id,wk)?' ✓':''}</option>`).join('')}</optgroup>`:''}).join('')}</select><button class="btn sm" data-pnav="${ps[(idx+1)%ps.length].id}" aria-label="Giocatore successivo">›</button>${roleTag(p.role)}</div>${mod('avail')?`<label class="field" style="flex-direction:row;align-items:center;gap:6px">Stato ${availSelect(p.id,wk)}</label>`:''}</div>
 <div class="card-b flush"><div class="tw"><table class="t" id="entryTable"><thead><tr><th>Data</th><th>MD</th>${cols.map(m=>`<th class="n" title="${esc(m.l)}">${esc(m.s)}</th>`).join('')}<th></th></tr></thead><tbody>`;
 for(const e of list)h+=entryRow(e,cols,pbv);
 if(!list.length)h+=`<tr><td colspan="${cols.length+3}" class="muted" style="padding:14px 10px">Nessuna seduta in questa settimana. Aggiungila con i pulsanti qui sotto.</td></tr>`;
 h+=`</tbody><tbody id="entryFoot">${entryFoot(p,wk,cols)}</tbody></table></div>
 <div class="row" style="padding:10px 12px;border-top:1px solid var(--line)"><span class="hint">Aggiungi:</span>${MD_TYPES.map(md=>`<button class="btn sm ${STD_WEEK.includes(md)&&!have.has(md)?'':'ghost'}" data-addmd="${md}">+ ${md}</button>`).join('')}</div></div></section>`;
 const ms=matchesOf(p.id).filter(e=>e.wk===wk);
 h+=`<section class="card"><div class="card-h"><h2>Partita di fine settimana</h2><span class="hint">diventa il riferimento della settimana successiva</span><button class="btn sm" data-emode="match">Inserisci dati partita</button></div><div class="card-b flush">${ms.length?`<div class="tw"><table class="t"><thead><tr><th>Partita</th>${METRICS.map(m=>`<th class="n">${esc(m.s)}</th>`).join('')}</tr></thead><tbody>${ms.map(e=>`<tr><td>${esc(e.opp||'Partita')} · ${dShort(e.date)}</td>${METRICS.map(m=>`<td class="n">${fmtM(m.k,val(e,m.k))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:14px">Nessun dato partita in questa settimana.</div>'}</div></section>`;

function entryRow(e,cols,pbv){
 return `<tr data-row="${e.id}"><td><input class="inp" type="date" value="${e.date||''}" data-edate="${e.id}" style="padding:3px 5px;font-size:12.5px"></td><td><select class="inp" data-emd="${e.id}" style="padding:3px 4px;font-size:12.5px">${MD_TYPES.map(m=>`<option ${e.md===m?'selected':''}>${m}</option>`).join('')}</select></td>${cols.map(m=>{const v=e.v?.[m.k];const ph=m.k==='dpm'&&v==null?fmt(val(e,'dpm'),1):'';const vm=m.k==='vmax'&&v!=null&&pbv?` style="box-shadow:inset 0 -3px 0 ${{g:'var(--vm-grey)',y:'var(--vm-yellow)',gr:'var(--vm-green)',p:'var(--vm-purple)'}[vmClass(v,pbv)]||'transparent'}"`:'';return `<td class="n"><input class="ni ${m.k==='dist'?'w':''}" inputmode="decimal" data-e="${e.id}" data-k="${m.k}" value="${v??''}" placeholder="${ph}" aria-label="${esc(m.l)}"${vm}></td>`}).join('')}<td><button class="btn sm ghost danger" data-del="${e.id}" aria-label="Elimina seduta">✕</button></td></tr>`;
}
function entryFoot(p,wk,cols){
 const t=weekTotal(p.id,wk),r=reference(p.id,wk);const n=cols.length;

const COL_RX=[['player',/(player|giocator|atlet|athlete|^nome|^name|cognome)/],['date',/^(data|date|giorno|day)\b|session date/],['md',/^(md|session type|tipo seduta|tipo)$/],['dpm',/(dist.*\/\s*min|m\s*\/\s*min|metri\s*\/\s*min|dist\s*min|relative dist|dist\.?\s*rel)/],['d1520',/15\s*[-–]\s*20/],['d2025',/20\s*[-–]\s*25/],['d25',/(>\s*25|25\s*\+|over\s*25|sopra\s*25)/],['acc3',/acc[^0-9]*3/],['acc2',/acc[^0-9]*2/],['dec3',/dec[^0-9]*3/],['dec2',/dec[^0-9]*2/],['pm',/(pot.*met|metab.*pow|met.*power|pmet|met.*med)/],['vmax',/(vmax|max.*speed|vel.*max|velocit.*mass|top speed|max vel)/],['rpe',/\brpe\b/],['min',/(minut|duration|durata|^min\b|^mins?$|time played|tempo)/],['dist',/(dist.*tot|total dist|distanza|^dist(ance)?$)/]];
function normH(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function guessCols(head){const map={};head.forEach((h,i)=>{const n=normH(h);if(!n)return;for(const [k,rx] of COL_RX){if(map[k]!=null)continue;if(rx.test(n)){map[k]=i;break}}});return map}
function parseNumLoc(s){if(s==null||s==='')return null;if(typeof s==='number')return s;s=String(s).trim().replace(/\s/g,'');if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else s=s.replace(',','.');const n=parseFloat(s);return Number.isFinite(n)?n:null}
function parseCSV(txt){const first=txt.split(/\r?\n/)[0]||'';const del=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===del){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchPlayer(name){const toks=normH(name).replace(/[^a-z ]/g,' ').split(' ').filter(t=>t.length>1);if(!toks.length)return null;let best=null,bs=0;
 for(const p of players()){const pt=normH(p.name).replace(/[^a-z ]/g,' ').split(' ').filter(t=>t.length>1);let s=0;for(const a of pt)for(const b of toks){if(a===b)s+=3;else if(a.length>3&&b.length>3&&lev(a,b)<=2)s+=2}if(s>bs){bs=s;best=p.id}}
 return bs>=2?best:null}

 if(mod('zscore')&&t){const keys=['dist','d1520','d2025','d25','acc3','dec3'];
  h+=`<section class="card"><div class="card-h"><h2>Settimana vs sua media</h2><span class="hint">z-score: quante deviazioni standard sopra (+) o sotto (−) le sue settimane</span></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th>Parametro</th><th class="n">Questa settimana</th><th class="n">Sua media</th><th class="n">DS</th><th class="n">z</th><th style="width:40%"></th></tr></thead><tbody>${keys.map(k2=>{const arr=ws.map(w=>weekTotal(p.id,w)?.[k2]).filter(x=>x!=null);const mu=mean(arr),s=sd(arr);const z=s?(t[k2]-mu)/s:null;const pos=z==null?50:Math.max(2,Math.min(98,50+z*16));return `<tr><td>${esc(MK[k2].l)}</td><td class="n">${fmtM(k2,t[k2])}</td><td class="n">${fmt(mu)}</td><td class="n">${fmt(s)}</td><td class="n"><b>${z==null?'–':(z>0?'+':'')+fmt(z,1)}</b></td><td><div class="bar-mini" style="overflow:visible"><span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)"></span><i style="left:${pos-1.5}%;width:3%;background:${Math.abs(z??0)>2?'var(--st-over)':Math.abs(z??0)>1?'var(--st-under)':'var(--st-ok)'}"></i></div></td></tr>`}).join('')}</tbody></table></div></div></section>`}
 h+=`<section class="card"><div class="card-h"><h2>Storico settimane</h2></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Settimana</th><th class="n">Sed.</th><th class="n">Dist</th>${BANDED().map(x=>`<th class="n">% ${esc(x.s)}</th>`).join('')}<th class="n">Vmax</th><th>Riferimento</th></tr></thead><tbody>${ws.slice().reverse().map(w=>{const tt=weekTotal(p.id,w);if(!tt)return '';const rr=reference(p.id,w);return `<tr class="click" data-wkgo="${w}"><td class="stick">${esc(wkLabel(w))}</td><td class="n">${tt.n}</td><td class="n">${fmt(tt.dist)}</td>${BANDED().map(x=>`<td class="n">${cellPct(x.k,pctOf(tt,rr?.v,x.k),p.role)}</td>`).join('')}<td class="n"><span class="vm ${vmClass(tt.vmax,P_?.v)}">${fmt(tt.vmax,1)}</span></td><td class="muted" style="font-size:12px">${esc(refLabel(rr))}</td></tr>`}).join('')}</tbody></table></div></div></section>`;

function teamMatch(c){return memo('tm:'+c.id,()=>{const l=allEntries().filter(e=>e.kind==='match'&&(e.gid===c.id||(!e.gid&&e.date===c.date)));if(l.length)return {v:meanTotals(l.map(entryVals)),n:l.length,src:'auto'};if(c.manual&&Object.keys(c.manual).length)return {v:c.manual,n:0,src:'manual'};return null})}
VIEWS.calendar=()=>{
 const cal=calMatches();const keys=METRICS.map(m=>m.k);
 const rows=cal.map(c=>{const tm=teamMatch(c);return `<tr><td><input class="ni" style="width:44px" data-cal="${c.id}" data-ck="g" value="${c.g??''}"></td><td><input type="date" class="inp" data-cal="${c.id}" data-ck="date" value="${c.date||''}" style="padding:3px 5px;font-size:12.5px"></td><td><input class="inp" data-cal="${c.id}" data-ck="opp" value="${esc(c.opp||'')}" style="min-width:120px"></td><td><select class="inp" data-cal="${c.id}" data-ck="venue" style="padding:3px 4px">${['Casa','Trasferta','Neutro'].map(v=>`<option ${c.venue===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input class="inp" data-cal="${c.id}" data-ck="res" value="${esc(c.res||'')}" style="width:58px" placeholder="2-1"></td><td><select class="inp" data-cal="${c.id}" data-ck="comp" style="padding:3px 4px">${['Campionato','Amichevole','Coppa','Torneo'].map(v=>`<option ${c.comp===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${tm?`<span class="tag ${tm.src==='auto'?'acc':''}" data-tip="${tm.src==='auto'?'Media calcolata dai dati partita dei giocatori':'Valori inseriti a mano nel vecchio Excel'}">${tm.src==='auto'?tm.n+' gioc.':'manuale'}</span>`:'<span class="muted">–</span>'}</td>${keys.map(k=>`<td class="n">${tm?fmtM(k,tm.v[k]):'–'}</td>`).join('')}<td><button class="btn sm ghost danger" data-caldel="${c.id}" aria-label="Elimina partita">✕</button></td></tr>`}).join('');
 const withD=cal.filter(c=>teamMatch(c));const agg=l=>meanTotals(l.map(c=>teamMatch(c).v));
 const sumRow=(lbl,l)=>`<tr class="sum"><td colspan="7">${lbl} <span class="muted">(${l.length})</span></td>${valsRow(l.length?agg(l):null,METRICS)}<td></td></tr>`;
 const ck=S.ui.calMetric||'dist';
 return `<section class="card"><div class="card-h"><h2>Partite</h2><button class="btn pri" id="addMatch">Aggiungi partita</button><span class="sub">Le medie di squadra si calcolano dai dati partita dei giocatori (Inserimento → Partita). Le partite senza dati individuali mostrano i valori inseriti a mano.</span></div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th>G</th><th>Data</th><th>Avversario</th><th>Campo</th><th>Ris.</th><th>Comp.</th><th>Fonte</th>${metricHead(METRICS)}<th></th></tr></thead><tbody>${rows||`<tr><td colspan="${keys.length+8}"><div class="empty">Nessuna partita in calendario.</div></td></tr>`}${sumRow('Media stagione',withD)}${sumRow('Media in casa',withD.filter(c=>c.venue==='Casa'))}${sumRow('Media in trasferta',withD.filter(c=>c.venue==='Trasferta'))}</tbody></table></div></div></section>
 ${withD.length?`<section class="card"><div class="card-h"><h2>Andamento partite</h2><div class="pill-row">${METRICS.filter(m=>m.k!=='min').map(m=>`<button class="pill" data-calm="${m.k}" aria-pressed="${ck===m.k}">${esc(m.s)}</button>`).join('')}</div></div><div class="card-b">${lineChart({labels:withD.map(c=>(c.g?'G'+c.g:dShort(c.date))),aria:'Andamento partite',series:[{name:MK[ck].l,color:'var(--s1)',vals:withD.map(c=>teamMatch(c).v[ck]??null),dotColor:withD.map(c=>c.venue==='Casa'?'var(--s1)':'var(--s2)')}],refY:[{y:agg(withD)[ck]||0,label:'media '+fmtM(ck,agg(withD)[ck])}],w:1200,h:260,yfmt:v=>fmt(v,MK[ck].d),tip:i=>`<b>${esc(withD[i].opp)}</b> · ${dShort(withD[i].date)} · ${esc(withD[i].venue)}<br>${MK[ck].l}: ${fmtM(ck,teamMatch(withD[i]).v[ck])} ${MK[ck].u}`})}${legend([['var(--s1)','Casa'],['var(--s2)','Trasferta']])}</div></section>`:''}`;

/* ================= VISTA: QUALITÀ DATI ================= */
function qualityIssues(){return memo('q',()=>{
 const out=[];const all=allEntries();const cal=calMatches();
 const nrm=s=>normH(s).replace(/[^a-z0-9]/g,'').replace(/^(fc|lr|ac|us|ssd|asd)/,'');
 for(const e of all){const nm=pName(e.p);const where=`${nm} · ${e.kind==='match'?'partita':e.md} ${dShort(e.date)}`;
  if(e.kind==='match'){const c=cal.find(c=>c.date===e.date);if(c&&e.opp&&!nrm(c.opp).includes(nrm(e.opp))&&!nrm(e.opp).includes(nrm(c.opp)))out.push({sev:'hi',t:'Avversario diverso dal calendario',d:`${where}: scritto “${e.opp}”, in calendario quel giorno c’è “${c.opp}”. Probabilmente il dato è finito nella settimana sbagliata.`,e});if(!e.opp&&!c)out.push({sev:'lo',t:'Partita senza avversario',d:where,e})}
  const d=val(e,'dist'),mi=val(e,'min'),dp=num(e.v?.dpm);if(d&&mi&&dp&&Math.abs(dp-d/mi)/(d/mi)>.12)out.push({sev:'lo',t:'Dist/min non coerente',d:`${where}: inserito ${fmt(dp)} ma ${fmt(d)} m / ${fmt(mi)}' = ${fmt(d/mi,1)}`,e});
  const vm=val(e,'vmax');if(vm!=null&&(vm>37||(vm<12&&(mi||0)>20)))out.push({sev:'md',t:'Velocità massima anomala',d:`${where}: ${fmt(vm,1)} km/h`,e});
  const bs=(val(e,'d1520')||0)+(val(e,'d2025')||0)+(val(e,'d25')||0);if(d&&bs>d)out.push({sev:'md',t:'Fasce di velocità > distanza totale',d:`${where}: ${fmt(bs)} m nelle fasce su ${fmt(d)} m totali`,e});
  if(e.date&&weekOfDate(e.date)!==e.wk)out.push({sev:'md',t:'Data fuori dalla settimana',d:`${where}: la data cade nella settimana ${weekOfDate(e.date)}`,e});
 }
 const seen=new Map();for(const e of all){const k=e.p+e.date+e.kind+(e.kind==='training'?e.md:'');if(seen.has(k))out.push({sev:'hi',t:'Seduta doppia',d:`${pName(e.p)} · ${e.md} ${dShort(e.date)} è inserita due volte`,e});else seen.set(k,e)}
 const sig=new Map();for(const e of all){if(val(e,'dist')==null)continue;const k=e.date+'|'+['min','dist','d1520','d2025','acc3','vmax'].map(x=>val(e,x)).join('|');if(sig.has(k)&&sig.get(k).p!==e.p){const o=sig.get(k);out.push({sev:'hi',t:'Dati identici per due giocatori',d:`${pName(o.p)} e ${pName(e.p)} hanno gli stessi valori il ${dShort(e.date)} (${fmt(val(e,'dist'))} m, ${fmt(val(e,'min'))}'): probabilmente un copia-incolla.`,e})}else sig.set(k,e)}
 const ac=all.filter(e=>val(e,'acc2')!=null&&val(e,'acc3')!=null);const bad=ac.filter(e=>val(e,'acc3')>val(e,'acc2'));const dc=all.filter(e=>val(e,'dec2')!=null&&val(e,'dec3')!=null);const badd=dc.filter(e=>val(e,'dec3')>val(e,'dec2'));
 if(S.settings.accMode!=='fasce'&&bad.length>ac.length*.1)out.unshift({sev:'md',t:`Acc >3 maggiore di Acc >2 in ${bad.length} righe su ${ac.length}`,d:`Se “>2 m/s²” fosse cumulativo (comprende anche le >3) non potrebbe essere minore di “>3”. Succede anche per le decelerazioni (${badd.length} su ${dc.length}). Probabilmente l’export del GPS usa fasce separate (2–3 e >3) o un criterio di durata diverso: verifica nel software GPS prima di confrontare le due colonne.`,group:true});
 const o={hi:0,md:1,lo:2};return out.sort((a,b)=>o[a.sev]-o[b.sev]);
})}
VIEWS.quality=()=>{
 const q=qualityIssues();
 return `<section class="card"><div class="card-h"><h2>Controlli sui dati</h2><span class="badge ${q.some(x=>x.sev==='hi')?'':'soft'}">${q.length}</span><span class="sub">Controlli automatici su tutte le sedute e partite inserite.</span></div><div>${q.length?q.map(x=>`<div class="alert"><span class="sev ${x.sev}"></span><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p></div>${x.e?`<button class="btn sm ghost" data-fix="${x.e.id}">Apri</button>`:''}</div>`).join(''):'<div class="empty"><b>Nessun problema trovato</b></div>'}</div></section>`;
};

  </div><div class="card-b" style="padding-top:0"><div class="note">Perché: se un giocatore entra per 37' la sua partita vale poco come riferimento, e la settimana risulta al 700–800% (es. Veronese sett. 6). Con i minuti minimi si usa l’ultima partita “vera”; con la normalizzazione i volumi vengono riportati a una durata fissa in base ai metri al minuto.</div></div></section>

async function getDownloads(){try{return await window.claude?.use?.('downloads')}catch(e){return null}}
async function saveFile(filename,data){const dl=window.claude?await getDownloads():null;if(!dl){if(window.claude){toast('Download non disponibile in questa vista.');return}try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('File scaricato: '+filename)}catch(e){toast('Download non riuscito.')}return}try{await dl.save({filename,data});toast('File pronto: '+filename)}catch(e){if(e?.code!=='declined')toast('Download non riuscito ('+(e?.code||'errore')+').')}}
function flatRows(){return allEntries().map(e=>({Giocatore:pName(e.p),Ruolo:ROLE[P(e.p)?.role]?.l||'',Settimana:e.wk,Data:e.date,Tipo:e.kind==='match'?'Partita':'Allenamento',MD:e.md,Avversario:e.opp||'',...Object.fromEntries(METRICS.map(m=>[m.l,val(e,m.k)])),...(mod('rpe')?{RPE:val(e,'rpe'),sRPE:val(e,'srpe')}:{})}))}
function toCSV(rows){if(!rows.length)return '';const h=Object.keys(rows[0]);const q=v=>v==null?'':typeof v==='number'?String(v).replace('.',','):/[;"\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;return [h.join(';'),...rows.map(r=>h.map(k=>q(r[k])).join(';'))].join('\n')}
async function exportXlsx(){
 try{await loadXLSX()}catch(e){toast('Non riesco a caricare il generatore Excel: scarico il CSV.');return saveFile(`sedute_${d2s(new Date())}.csv`,'﻿'+toCSV(flatRows()))}
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(flatRows()),'Sedute');
 const tot=[];for(const w of weeksWithData())for(const p of players()){const t=weekTotal(p.id,w);if(!t)continue;const r=reference(p.id,w);const row={Settimana:w,Giocatore:p.name,Ruolo:ROLE[p.role]?.l,Sedute:t.n,Riferimento:refLabel(r)};for(const m of METRICS){row[m.s]=t[m.k]!=null?+t[m.k].toFixed(m.d||1):null;if(S.settings.bands[m.k]){const pc=pctOf(t,r?.v,m.k);row['% '+m.s]=pc!=null?Math.round(pc):null;row['Sem. '+m.s]=ST_L[status(m.k,pc,p.role)]||''}}tot.push(row)}
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tot),'Totali settimanali');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(calMatches().map(c=>{const tm=teamMatch(c);return {G:c.g,Data:c.date,Avversario:c.opp,Campo:c.venue,Risultato:c.res,Competizione:c.comp,Fonte:tm?.src||'',...Object.fromEntries(METRICS.map(m=>[m.l,tm?.v?.[m.k]!=null?+(+tm.v[m.k]).toFixed(1):null]))}})),'Calendario');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(players().map(p=>({Giocatore:p.name,Ruolo:ROLE[p.role]?.l,'PB km/h':pb(p.id)?.v??null}))),'Rosa');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 saveFile(`ElevenLab_${S.settings.season.replace('/','-')}_${d2s(new Date())}.xlsx`,new Blob([buf]));
}
async function restoreBackup(file){
 let d;try{d=JSON.parse(await file.text())}catch(e){toast('Il file non è un backup valido.');return}
 if(!d?.weeks||!d?.roster){toast('Il file non è un backup di Eleven Lab.');return}
 confirmBox('Ripristinare il backup?','Tutti i dati attuali verranno sostituiti da quelli del file.','Ripristina',()=>{
  const old=Object.keys(S.weeks);S.settings=mergeSettings(d.settings);S.roster=d.roster;S.calendar=d.calendar||{matches:{}};S.weeks={};for(const [k,w] of Object.entries(d.weeks))S.weeks[w.wk??k]=w;if(d.tests){S.tests=d.tests;saveTests()}if(d.anthro){S.anthro=d.anthro;saveAnthro()}if(d.injuries){S.injuries=d.injuries;saveInjuries()}if(d.wellness){S.wellness={};for(const [k,w] of Object.entries(d.wellness)){const wk=w.wk??+k;S.wellness[wk]={...w,wk};saveWell(wk)}}
  for(const k of old)if(!S.weeks[k])markDirty(wkPath(+k),()=>null);
  for(const k of Object.keys(S.weeks))saveWeek(+k);saveSettings();saveRoster();saveCalendar();invalidate();toast('Backup ripristinato.');render()});
}

const ROLE_COL={DC:'#3987e5',TZ:'#199e70',CC:'#7c6cf0',ES:'#c98500',AT:'#d95926',PO:'#d55181'};
function initials(n){return n.split(/\s+/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase()}
function avatar(p,size){return `<span class="av" style="background:${ROLE_COL[p.role]||'#666'}${size?`;width:${size}px;height:${size}px`:''}" aria-hidden="true">${esc(initials(p.name))}</span>`}
const AV_DOT={disp:'#22b45a',diff:'#fab219',inf:'#e0464a',mal:'#e0464a',naz:'#3987e5',rip:'#7c84a3'};
function shortName(n){const a=n.split(/\s+/);return a.length>1?a[0]+' '+a[1][0]+'.':n}
function quant(a,q){a=a.filter(x=>x!=null&&Number.isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const pos=(a.length-1)*q,lo=Math.floor(pos),hi=Math.ceil(pos);return a[lo]+(a[hi]-a[lo])*(pos-lo)}
function median(a){return quant(a,.5)}
function modeOf(a){a=a.filter(x=>x!=null);if(a.length<3)return null;const mn=Math.min(...a),mx=Math.max(...a);const st=niceMax((mx-mn)/18||1);const c=new Map();for(const v of a){const b=Math.round(v/st)*st;c.set(b,(c.get(b)||0)+1)}let best=null,bn=0;for(const [b,n] of c)if(n>bn){bn=n;best=b}return best}
const XMET=()=>[...METRICS.map(m=>({k:m.k,l:m.l,s:m.s,u:m.u,d:m.d})),{k:'hsr',l:'HSR >20 km/h',s:'HSR',u:'m',d:0},{k:'hid',l:'Acc+Dec >3 m/s²',s:'A+D>3',u:'n',d:0},...(mod('rpe')?[{k:'srpe',l:'sRPE',s:'sRPE',u:'UA',d:0}]:[])];

 {k:'vel',s:'VEL',l:'Vmax',d:'velocità massima nel periodo',u:'km/h',f:a=>a.vmax,thr:3,dec:1},
