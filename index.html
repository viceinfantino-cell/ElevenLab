function periodAgg(pid,per,kind){return memo(`pa:${pid}:${per}:${kind}:${S.ui.wk}`,()=>{
 const l=allEntries().filter(e=>e.p===pid&&inPeriod(e,per,kind));if(!l.length)return null;
 const a={n:l.length,min:0,dist:0,d1520:0,d2025:0,d25:0,acc3:0,dec3:0,acc2:0,dec2:0,vmax:null,pm:null};let pw=0,ps=0;
 for(const e of l){for(const k of ['min','dist','d1520','d2025','d25','acc3','dec3','acc2','dec2'])a[k]+=val(e,k)||0;const v=val(e,'vmax');if(v!=null&&(a.vmax==null||v>a.vmax))a.vmax=v;const pm=val(e,'pm'),mi=val(e,'min');if(pm!=null&&mi){pw+=mi;ps+=pm*mi}}
 a.pm=pw?ps/pw:null;return a})}
function ratings(per,kind){return memo(`rt:${per}:${kind}:${S.ui.wk}:${ui('injIncl','false')}`,()=>{
 const inc=String(ui('injIncl','false'))==='true';const ps=players().filter(p=>inc||!excluded(p.id,S.ui.wk));const out={};const vals={};
 for(const p of ps){const a=periodAgg(p.id,per,kind);if(!a||a.min<120)continue;out[p.id]={a,v:{},s:{}};for(const ar of AREAS)out[p.id].v[ar.k]=ar.f(a)}
 for(const ar of AREAS){const arr=Object.values(out).map(o=>o.v[ar.k]).filter(v=>v!=null);vals[ar.k]=arr;
  for(const o of Object.values(out)){const v=o.v[ar.k];if(v==null){o.s[ar.k]=null;continue}const below=arr.filter(x=>x<v).length,eq=arr.filter(x=>x===v).length;const pct=arr.length>1?(below+(eq-1)/2)/(arr.length-1):.5;o.s[ar.k]=Math.round(40+59*pct)}}
 for(const o of Object.values(out)){const sc=CARD_AREAS.map(k=>o.s[k]).filter(x=>x!=null);o.ovr=sc.length?Math.round(mean(sc)):null;o.pct=Math.round(mean(AREAS.map(a=>o.s[a.k]).filter(x=>x!=null).map(s=>(s-40)/59*100)))}
 return {by:out,vals};
})}
function tierOf(o){return o==null?'nd':o>=80?'oro':o>=65?'argento':'bronzo'}
function sparkW(pid,n=8){const wk=S.ui.wk;const v=[];for(let w=wk-n+1;w<=wk;w++)v.push(weekTotal(pid,w)?.dist??0);const mx=Math.max(...v,1);const pts=v.map((x,i)=>`${(i/(n-1)*150).toFixed(1)},${(26-x/mx*22).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 150 28" width="100%" height="28" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`}

function statFilters(withPlayer){const k=ui('stK','dist');return `<div class="row" style="gap:16px">${withPlayer?flt('Atleta',`<select class="inp" data-uisel="stP">${players().map(p=>`<option value="${p.id}" ${ui('stP',players()[0]?.id)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`):''}${flt('Parametro',`<select class="inp" data-uisel="stK">${XMET().map(m=>`<option value="${m.k}" ${m.k===k?'selected':''}>${esc(m.l)}</option>`).join('')}</select>`)}${flt('Periodo',seg('stPer',ui('stPer','all'),[['4','4 sett.'],['8','8 sett.'],['all','Stagione']]))}${flt('Sedute',seg('stKind',ui('stKind','all'),[['all','Tutte'],['training','Allenamenti'],['match','Partite']]))}</div>`}
function statTiles(vals,m){const s=vals.reduce((a,b)=>a+b,0),mu=mean(vals),d=sd(vals);const u=m.u&&m.u!=='n'?' '+m.u:'';const F=v=>v==null?'–':fmt(v,m.d)+u;
 return `<div class="stats">${[['Media',F(mu)],['Mediana',F(median(vals))],['Moda',F(modeOf(vals))],['Somma',s>1e6?fmt(s/1e6,2)+' mln'+u:F(s)],['Dev. standard','± '+F(d)],['CV',mu?fmt(d/mu*100,1)+'%':'–'],['Min – max',vals.length?fmt(Math.min(...vals),m.d)+' – '+fmt(Math.max(...vals),m.d):'–'],['P25 – P75',vals.length?fmt(quant(vals,.25),m.d)+' – '+fmt(quant(vals,.75),m.d):'–'],['N',fmt(vals.length)]].map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}</div>`}
function histogram(vals,m){if(vals.length<3)return '<div class="empty">Pochi valori.</div>';const mn=Math.min(...vals),mx=Math.max(...vals);const nb=12,w=(mx-mn)/nb||1;const bins=Array(nb).fill(0);for(const v of vals)bins[Math.min(nb-1,Math.floor((v-mn)/w))]++;
 const W=640,H=200,L=36,R=10,T=10,B=26,iw=W-L-R,ih=H-T-B,ym=Math.max(4,Math.ceil(Math.max(...bins)/4)*4),x=v=>L+(v-mn)/(mx-mn||1)*iw,bw=iw/nb;let g='';
 for(let i=0;i<=4;i++){const v=ym*i/4,y=T+ih-v/ym*ih;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-5}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
 bins.forEach((n,i)=>{const h=n/ym*ih;if(n)g+=`<rect x="${L+i*bw+1}" y="${T+ih-h}" width="${bw-2}" height="${h}" rx="3" fill="var(--accent)" opacity=".85" data-tip="${esc(fmt(mn+i*w,m.d)+' – '+fmt(mn+(i+1)*w,m.d)+': '+n)}"/>`});
 [[mean(vals),'Media','var(--st-under)'],[median(vals),'Mediana','var(--st-ok)'],[modeOf(vals),'Moda','var(--s5)']].forEach(([v,l,c],j)=>{if(v==null)return;const xx=x(v);g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+ih}" stroke="${c}" stroke-width="1.6" stroke-dasharray="4 3"/>`});
 g+=`<text x="${L}" y="${H-8}">${fmt(mn,m.d)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmt(mx,m.d)}</text>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuzione dei valori">${g}</svg>${legend([['var(--st-under)','Media '+fmt(mean(vals),m.d)],['var(--st-ok)','Mediana '+fmt(median(vals),m.d)],['var(--s5)','Moda '+fmt(modeOf(vals),m.d)]])}`}
function sessionSeries(list,k){const by=new Map();for(const e of list){const v=val(e,k);if(v==null||!e.date)continue;if(!by.has(e.date))by.set(e.date,{v:[],match:false});const o=by.get(e.date);o.v.push(v);if(e.kind==='match')o.match=true}
 const dates=[...by.keys()].sort();const pts=dates.map(d=>({d,m:mean(by.get(d).v),match:by.get(d).match,n:by.get(d).v.length}));
 const roll=days=>dates.map(d=>{const from=addDays(d,-(days-1));const a=[];for(const e of list)if(e.date>=from&&e.date<=d){const v=val(e,k);if(v!=null)a.push(v)}return mean(a)});
 return {pts,r7:roll(7),r28:roll(28)}}

 return statFilters()+`<div class="hint">Gruppo squadra · ${vals.length} valori atleta-seduta · ${ss.pts.length} sedute · ${periodLabel(per)}</div>${statTiles(vals,m)}

function lastDataDate(from,to){const l=allEntries().filter(e=>e.date&&e.date>=from&&e.date<=to);return l.length?l[l.length-1].date:to}
function acwrEwma(pid,date,k){return memo(`ew:${pid}:${date}:${k}`,()=>{const l=allEntries().filter(e=>e.p===pid&&e.date&&e.date<=date);if(!l.length)return null;const first=l.find(e=>e.date)?.date;const by=new Map();for(const e of l){const v=val(e,k);if(v!=null)by.set(e.date,(by.get(e.date)||0)+v)}
 const teamDays=memo('teamDays',()=>new Set(allEntries().map(e=>e.date).filter(Boolean)));
 const la=2/8,lc=2/29;let a=0,c=0,d=first,n=0;while(d<=date){if(by.has(d)||!teamDays.has(d)){const L=by.get(d)||0;a=la*L+(1-la)*a;c=lc*L+(1-lc)*c}d=addDays(d,1);n++}
 const recent=l.some(e=>e.date>=addDays(date,-13));return recent?{a,c,r:c?a/c:null,days:n}:null})}
function acwrEwmaAll(date,k=ui('acK','dist')){return players().map(p=>({p,...(acwrEwma(p.id,date,k)||{})})).filter(x=>x.a!=null)}

 const rows=acwrEwmaAll(date,k).sort((a,b)=>(b.days>=28)-(a.days>=28)||(b.r??0)-(a.r??0));const z=r=>r==null?'none':r<.8?'under':r>hi?'over':'ok';const f=ui('acF',null);
 const cnt=t=>rows.filter(x=>x.days>=28&&z(x.r)===t).length;const show=f?rows.filter(x=>z(x.r)===f):rows;const mx=Math.max(1.6,...rows.map(x=>x.r||0));
 const opts=[['dist','Distanza totale'],['hsr','HSR >20 km/h'],['hid','Acc+Dec >3'],...(mod('rpe')?[['srpe','sRPE']]:[])];
 return `<div class="row" style="gap:16px">${flt('Data del report',`<input type="date" class="inp" data-uisel="acDate" value="${date}">`)}${flt('Carico',`<select class="inp" data-uisel="acK">${opts.map(([v,l])=>`<option value="${v}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`)}${flt('Soglia alta',seg('acwrHi',hi,[['1.2','1,20'],['1.3','1,30']]))}</div>
 <div class="hint">Acuto <b>7 giorni</b> e cronico <b>28 giorni</b> con medie mobili esponenziali (EWMA) · allenamenti e partite inclusi · carico: <b>${esc(opts.find(o=>o[0]===k)[1])}</b>. I giorni di riposo contano zero; i giorni in cui la squadra si è allenata ma il giocatore non ha dati GPS vengono saltati, così l’assenza del GPS non abbassa il cronico.</div>
 <div class="grid g3">${[['under','Sotto 0,80','tone-under'],['ok','0,80 – '+fmt(hi,2),'tone-ok'],['over','Sopra '+fmt(hi,2),'tone-over']].map(([t,l,c])=>`<button type="button" class="kpi ${c}" data-ui="acF" data-val="${f===t?'':t}" style="text-align:left;cursor:pointer;font:inherit;color:inherit${f===t?';outline:2px solid var(--accent-2)':''}"><span>${l}</span><b>${cnt(t)}</b><small>atleti · tocca per filtrare</small></button>`).join('')}</div>
 <div class="split" style="grid-template-columns:minmax(0,1fr) minmax(300px,440px)"><section class="card"><div class="card-h"><h2>Rapporto acuto:cronico per atleta</h2><span class="hint">chi sta facendo più (o meno) del suo abituale</span></div><div class="card-b"><div class="hb" style="grid-template-columns:120px minmax(0,1fr) 50px">${show.map(x=>`<span class="l" style="${x.days<28?'opacity:.55':''}">${esc(shortName(x.p.name))}${x.days<28?' *':''}</span><span class="tr" style="${x.days<28?'opacity:.45':''}" data-player="${x.p.id}" style="cursor:pointer"><i style="width:${(x.r||0)/mx*100}%;background:${ST_COL[z(x.r)]}"></i><u style="left:${.8/mx*100}%"></u><u style="left:${hi/mx*100}%;border-color:var(--st-over)"></u></span><span class="v">${fmt(x.r,2)}</span>`).join('')||'<span></span><span class="hint">Nessun atleta.</span><span></span>'}</div></div></section>
 <section class="card"><div class="card-h"><h2>Carico atleti</h2></div><div class="card-b flush"><div class="tw" style="max-height:620px;overflow:auto"><table class="t"><thead><tr><th>Atleta</th><th class="n">Acuto</th><th class="n">Cronico</th><th class="n">Rapporto</th></tr></thead><tbody>${show.map(x=>`<tr class="click" data-player="${x.p.id}" style="${x.days<28?'opacity:.6':''}"><td class="name">${esc(x.p.name)}${x.days<28?' *':''}</td><td class="n">${fmt(x.a)}</td><td class="n">${fmt(x.c)}</td><td class="n"><span class="cell ${z(x.r)}">${fmt(x.r,2)}</span></td></tr>`).join('')}</tbody></table></div><div class="hint" style="padding:10px 14px">Acuto e cronico = carico medio giornaliero pesato. * meno di 28 giorni di storico: rapporto non ancora affidabile, escluso dai conteggi.</div></div></section></div>`;
};
V2.classifiche=()=>{

 const rows=players().map(p=>{const l=weekEntries(wk).filter(e=>e.p===p.id);if(!l.length)return null;const v=l.map(e=>val(e,k)).filter(x=>x!=null);if(!v.length)return null;return {p,v:k==='vmax'?Math.max(...v):['dpm','pm'].includes(k)?mean(v):v.reduce((a,b)=>a+b,0)}}).filter(Boolean).sort((a,b)=>b.v-a.v);const mx=Math.max(...rows.map(r=>r.v),1);

V2.podio=()=>{
 const wk=S.ui.wk;const cats=[['dist','Distanza totale','m',0],['hsr','HSR >20 km/h','m',0],['d25','Sprint >25 km/h','m',0],['vmax','Velocità massima','km/h',1],['hid','Acc + Dec >3 m/s²','n',0],['dpm','Ritmo (m/min)','m/min',1]];
 const calc=k=>players().map(p=>{const l=weekEntries(wk).filter(e=>e.p===p.id);const v=l.map(e=>val(e,k)).filter(x=>x!=null);if(!v.length)return null;if(k==='dpm'){const mi=l.reduce((s,e)=>s+(val(e,'min')||0),0);if(mi<60)return null;return {p,v:l.reduce((s,e)=>s+(val(e,'dist')||0),0)/mi}}return {p,v:k==='vmax'?Math.max(...v):v.reduce((a,b)=>a+b,0)}}).filter(Boolean).sort((a,b)=>b.v-a.v).slice(0,3);
 return `<div class="grid g3">${cats.map(([k,l,u,d])=>{const t=calc(k);const pod=(r,cls,medal)=>r?`<div class="${cls}" data-player="${r.p.id}" style="cursor:pointer"><em>${medal}</em>${avatar(r.p,30)}<b>${esc(shortName(r.p.name))}</b><span class="mono">${fmt(r.v,d)}</span> <span class="hint">${u}</span></div>`:`<div class="${cls}"></div>`;return `<section class="card"><div class="card-h"><h2>${l}</h2></div><div class="card-b">${t.length?`<div class="podium">${pod(t[1],'p2','🥈')}${pod(t[0],'p1','🥇')}${pod(t[2],'p3','🥉')}</div>`:'<div class="empty">Nessun dato.</div>'}</div></section>`}).join('')}</div><div class="hint">Settimana completa: allenamenti + partita. Ritmo solo con almeno 60′.</div>`;
};

const XL_SED=['Data','Settimana','Giocatore','Ruolo','Tipo','MD','Avversario','Minuti','Distanza totale (m)','Dist/min','15-20 km/h (m)','20-25 km/h (m)','>25 km/h (m)','Acc >2','Acc >3','Dec <-2','Dec <-3','PotMet (W/kg)','Vmax (km/h)','RPE','ID'];
const XL_KEYS={'Minuti':'min','Distanza totale (m)':'dist','Dist/min':'dpm','15-20 km/h (m)':'d1520','20-25 km/h (m)':'d2025','>25 km/h (m)':'d25','Acc >2':'acc2','Acc >3':'acc3','Dec <-2':'dec2','Dec <-3':'dec3','PotMet (W/kg)':'pm','Vmax (km/h)':'vmax','RPE':'rpe'};
function xlDate(s){const d=s2d(s);return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5)}
async function exportTemplate(){
 try{await loadXLSX()}catch(e){toast('Non riesco a caricare il generatore Excel, controlla la connessione.');return}
 const sed=[XL_SED];for(const e of allEntries()){const p=P(e.p);sed.push([e.date?xlDate(e.date):'',e.wk,p?.name||e.p,ROLE[p?.role]?.l||'',e.kind==='match'?'Partita':'Allenamento',e.md,e.opp||'',...Object.values(XL_KEYS).map(k=>e.v?.[k]??''),e.id])}
 const ros=[['Giocatore','Ruolo','Usa GPS (sì/no)','PB manuale (km/h)','ID']];for(const p of Object.values(S.roster.players))if(!p.archived)ros.push([p.name,ROLE[p.role]?.l||p.role,p.noGps?'no':'sì',p.pbManual??'',p.id]);
 const cal=[['G','Data','Avversario','Campo','Risultato','Competizione','ID']];for(const c of calMatches())cal.push([c.g??'',c.date?xlDate(c.date):'',c.opp||'',c.venue||'',c.res||'',c.comp||'',c.id]);
 const wb=XLSX.utils.book_new();const mk=(rows,w)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=w.map(x=>({wch:x}));return ws};
 const s1=mk(sed,[11,9,22,18,12,7,16,8,12,9,10,10,10,8,8,8,8,10,10,6,16]);for(let r=1;r<sed.length;r++){const c=s1[XLSX.utils.encode_cell({r,c:0})];if(c&&c.v!==''){c.t='n';c.z='dd/mm/yyyy'}}
 const s3=mk(cal,[5,11,22,11,10,13,10]);for(let r=1;r<cal.length;r++){const c=s3[XLSX.utils.encode_cell({r,c:1})];if(c&&c.v!==''){c.t='n';c.z='dd/mm/yyyy'}}
 XLSX.utils.book_append_sheet(wb,s1,'Sedute');XLSX.utils.book_append_sheet(wb,mk(ros,[24,20,14,16,22]),'Rosa');XLSX.utils.book_append_sheet(wb,s3,'Calendario');
 XLSX.utils.book_append_sheet(wb,mk([['Come usare questo file'],['Sedute: una riga per giocatore e per seduta. Tipo = Allenamento o Partita. MD = MD+1, MD+2, MD+3, MD-4, MD-3, MD-2, MD-1, Extra (per le partite MD).'],['Il nome del giocatore deve essere uguale a quello del foglio Rosa. Settimana si calcola dalla data: puoi lasciarla vuota.'],['Lascia la colonna ID vuota per le righe nuove; non modificarla per le righe esistenti.'],['Per caricare: app → Importa dati → Foglio Excel → Carica il file.']],[120]),'Istruzioni');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(`ElevenLab_dati_${d2s(new Date())}.xlsx`,new Blob([buf]));
}
function readSheetRows(wb,name){const sn=wb.SheetNames.find(n=>normH(n)===normH(name));if(!sn)return null;return XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''})}
function rowsToObjects(rows,must){if(!rows)return [];let hi=rows.findIndex(r=>r.some(c=>normH(c)===normH(must)));if(hi<0)return [];const h=rows[hi].map(x=>String(x).trim());return rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
function roleFrom(s){s=normH(s);const r=ROLES.find(r=>normH(r.l)===s||normH(r.id)===s||(s.startsWith('estern')&&r.id==='ES'));return r?.id||null}
async function parseLoadLabFile(file){
 await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
 const sed=rowsToObjects(readSheetRows(wb,'Sedute')||readSheetRows(wb,wb.SheetNames[0]),'Giocatore');
 const ros=rowsToObjects(readSheetRows(wb,'Rosa'),'Giocatore');const cal=rowsToObjects(readSheetRows(wb,'Calendario'),'Avversario');
 return {sed,ros,cal,name:file.name};
}
function planLoadLab(X,replace){
 const plan={pNew:[],pUpd:0,cNew:0,cUpd:0,eNew:0,eUpd:0,skip:[]};
 const roster=replace?{}:clone(S.roster.players);const byName=n=>Object.values(roster).find(p=>normH(p.name)===normH(n));
 for(const r of X.ros){const n=String(r['Giocatore']||'').trim();if(!n)continue;let p=(r['ID']&&roster[r['ID']])||byName(n);const role=roleFrom(r['Ruolo'])||p?.role||'CC';
  if(!p){const id=String(r['ID']||'').trim()||normH(n).replace(/[^a-z0-9]+/g,'-').slice(0,40);p=roster[id]={id,name:n,role,order:Object.keys(roster).length};plan.pNew.push(n)}else{p.name=n;p.role=role;plan.pUpd++}
  p.noGps=normH(r['Usa GPS (sì/no)'])==='no';const pbm=parseNumLoc(r['PB manuale (km/h)']);if(pbm)p.pbManual=pbm;else delete p.pbManual}
 const calM=replace?{}:clone(S.calendar.matches||{});
 for(const r of X.cal){const date=excelDate(r['Data']);if(!date)continue;let c=(r['ID']&&calM[r['ID']])||Object.values(calM).find(x=>x.date===date);if(!c){const id=String(r['ID']||'').trim()||'g'+uid('');c=calM[id]={id};plan.cNew++}else plan.cUpd++;
  Object.assign(c,{g:num(r['G']),date,opp:String(r['Avversario']||''),venue:String(r['Campo']||'Casa'),res:String(r['Risultato']||''),comp:String(r['Competizione']||'Campionato')})}
 const ents=[];const existing=replace?[]:allEntries();
 X.sed.forEach((r,i)=>{const nm=String(r['Giocatore']||'').trim();if(!nm)return;let p=byName(nm);if(!p){const id=Object.keys(roster).find(id=>id===matchPlayer(nm));p=roster[id]}if(!p){plan.skip.push(`riga ${i+2}: giocatore “${nm}” non in rosa`);return}
  const date=excelDate(r['Data']);if(!date){plan.skip.push(`riga ${i+2}: data mancante`);return}
  const kind=normH(r['Tipo']).startsWith('part')?'match':'training';let md=String(r['MD']||'').trim().toUpperCase();if(!MD_TYPES.includes(md)&&md!=='MD')md=kind==='match'?'MD':mdForDate(date);if(kind==='match')md='MD';
  const v={};for(const [h,k] of Object.entries(XL_KEYS)){const x=parseNumLoc(r[h]);if(x!=null)v[k]=x}if(!Object.keys(v).length){plan.skip.push(`riga ${i+2}: nessun valore`);return}
  const opp=String(r['Avversario']||'').trim();const id=String(r['ID']||'').trim();
  let e=(id&&existing.find(x=>x.id===id))||existing.find(x=>x.p===p.id&&x.kind===kind&&x.date===date&&(kind==='match'||x.md===md));
  if(e)plan.eUpd++;else plan.eNew++;
  const c=kind==='match'?Object.values(calM).find(x=>x.date===date):null;
  ents.push({id:e?.id||id||uid(),p:p.id,date,wk:weekOfDate(date),md,kind,opp:kind==='match'?(opp||c?.opp||null):undefined,gid:kind==='match'?(c?.id||null):undefined,v,_old:e?e.wk:null})});
 return {plan,roster,calM,ents};
}
function applyLoadLab(R,replace){
 const oldWeeks=Object.keys(S.weeks).map(Number);
 if(replace)S.weeks={};
 const touched=new Set();
 for(const x of R.ents){if(x._old!=null&&S.weeks[x._old]?.entries?.[x.id]){delete S.weeks[x._old].entries[x.id];touched.add(x._old)}const e={...x};delete e._old;if(e.kind!=='match'){delete e.opp;delete e.gid}ensureWeek(e.wk).entries[e.id]=e;touched.add(e.wk)}
 S.roster.players=R.roster;S.calendar.matches=R.calM;invalidate();
 if(replace)for(const w of oldWeeks)if(!S.weeks[w])markDirty(wkPath(w),()=>null);
 for(const w of (replace?Object.keys(S.weeks).map(Number):touched))saveWeek(w);
 saveRoster();saveCalendar();
}

/* ACWR unico: EWMA alla data dell'ultimo dato della settimana */
function acwr(pid,wk){return memo(`acwr2:${pid}:${wk}`,()=>{const ws=weekStart(wk);if(!weekEntries(wk).some(e=>e.p===pid))return null;const date=lastDataDate(ws,addDays(ws,6));const r=acwrEwma(pid,date,S.settings.acwr.metric);if(!r)return null;return {a:r.a,c:r.c,r:r.days>=28?r.r:null,n:Math.floor(r.days/7)}})}

function nameMatch(name){const t=normH(name).replace(/[^a-z ]/g,' ').split(' ').filter(x=>x.length>1);if(!t.length)return null;let best=null,bs=0;
 for(const p of Object.values(S.roster.players||{})){if(p.archived)continue;for(const c of [p.name,...(p.aliases||[])]){const pt=normH(c).replace(/[^a-z ]/g,' ').split(' ').filter(x=>x.length>1);let s=0;for(const a of pt)for(const b of t){if(a===b)s+=3;else if(a.length>3&&b.length>3&&lev(a,b)<=2)s+=2}if(s>bs){bs=s;best=p.id}}}
 return bs>=4?best:null}

/* ---------- wellness ---------- */
function wellOf(pid,date){if(!date)return null;const wk=weekOfDate(date);return S.wellness[wk]?.days?.[date]?.[pid]||null}
function wellDates(){const s=new Set();for(const w of Object.values(S.wellness))for(const d of Object.keys(w.days||{}))s.add(d);return [...s].sort()}
function recBase(pid,date){return memo(`rb:${pid}:${date}`,()=>{const from=addDays(date,-28);const v=[];for(const d of wellDates())if(d>=from&&d<date){const w=wellOf(pid,d);if(w?.rec!=null)v.push(w.rec)}return v.length>=4?mean(v):null})}
function recCls(r){return r==null?'none':r<=2?'over':r>=4?'ok':'info'}

function injList(){return Object.values(S.injuries.items||{}).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function injuryInWeek(pid,wk){const a=weekStart(wk),b=addDays(a,6);for(const i of injList()){if(i.p!==pid||!i.date)continue;const end=i.status==='chiuso'?(i.returnDate||i.date):'9999';if(i.date<=b&&end>=a)return i}return null}
function activeInj(){return injList().filter(i=>i.status!=='chiuso')}
function injBaseline(i){return memo('ib:'+i.id,()=>{const from=addDays(i.date,-28);const l=allEntries().filter(e=>e.p===i.p&&e.kind==='training'&&e.date>=from&&e.date<i.date);if(!l.length)return null;const o={n:l.length};for(const k of ['dist','hsr','d25','hid','min'])o[k]=mean(l.map(e=>val(e,k)));o.vmax=Math.max(...l.map(e=>val(e,'vmax')||0));return o})}
function daysLost(i){const end=i.status==='chiuso'?(i.returnDate||i.date):d2s(new Date());return Math.max(0,Math.round((s2d(end)-s2d(i.date))/864e5))}

/* ---------- crescita e maturazione ---------- */
function ageAt(birth,date){if(!birth)return null;return (s2d(date)-s2d(birth))/864e5/365.25}
function anthroOf(pid){return Object.values(S.anthro.items||{}).filter(a=>a.p===pid&&a.h).sort((a,b)=>a.date.localeCompare(b.date))}
function maturity(pid){return memo('mat:'+pid,()=>{const p=P(pid);const l=anthroOf(pid);if(!l.length)return {l};const last=l[l.length-1];const age=ageAt(p?.birth,last.date);const o={l,last,age};
 const shC=last.sh?last.sh-(num(S.settings.benchCm)||0):null;o.shC=shC;if(shC&&shC/last.h>0.6)o.benchIssue=true;
 if(age!=null&&shC&&last.w&&!o.benchIssue){const H=last.h,SH=shC,LL=H-SH,W=last.w;o.mirwald=-9.236+0.0002708*(LL*SH)-0.001663*(age*LL)+0.007216*(age*SH)+0.02292*(W/H*100);o.moore=-8.1239+0.0070346*(age*SH);o.off=o.moore;o.aphv=age-o.off;o.stage=o.off<-1?'pre':o.off>1?'post':'circa'}
 const prev=l.slice(0,-1).reverse().find(a=>(s2d(last.date)-s2d(a.date))/864e5>=56);if(prev){const yrs=(s2d(last.date)-s2d(prev.date))/864e5/365.25;o.rate=(last.h-prev.h)/yrs;o.rateFrom=prev.date}
 return o})}

function maxN(...a){a=a.filter(x=>x!=null);return a.length?Math.max(...a):null}
function tval(r,m){if(!r)return null;const v=m.f?m.f(r):r[m.k];return v==null||!Number.isFinite(+v)?null:+v}
function testSessions(){return Object.values(S.tests.sessions||{}).sort((a,b)=>a.date.localeCompare(b.date))}

const TEST_AREAS=[{k:'t_cmj',tk:'cmj',s:'CMJ',l:'CMJ (test)',d:'salto con mani ai fianchi',u:'cm',thr:5,dec:1,test:1},{k:'t_vam',tk:'vam',s:'VAM',l:'VAM (test)',d:'velocità aerobica massima',u:'km/h',thr:4,dec:1,test:1},{k:'t_s10',tk:'s10',s:'S10',l:'Sprint 10 m (test)',d:'tempo sui 10 m',u:'s',thr:2,dec:2,test:1,lo:1},{k:'t_rsi',tk:'rsi',s:'RSI',l:'Stiffness (test)',d:'indice di forza reattiva',u:'',thr:8,dec:2,test:1}];
function FA(){return [...AREAS,...(testSessions().length?TEST_AREAS:[])]}

function parseCode(c){if(c==null||c==='')return null;c=String(c).trim().toUpperCase();if(c==='INF')return {st:'inf',min:0};if(c==='ND')return {st:'nd',min:0};const s=c.match(/^S\s*(\d+)$/);if(s)return {st:'sub',min:+s[1]};const n=parseFloat(c.replace(',','.'));if(Number.isFinite(n))return n>0?{st:'tit',min:n}:{st:'pan',min:0};return null}

const LU_L={tit:'Titolare',sub:'Subentrato',inf:'Infortunato',nd:'Non disponibile',pan:'In panchina / non entrato'};
function playedMatches(){return calMatches().filter(c=>c.lineup&&Object.keys(c.lineup).length)}
function minutesStats(pid){const ms=playedMatches();let tot=0,tit=0,sub=0,mt=0,msub=0,inf=0,nd=0;for(const c of ms){const x=parseCode(c.lineup[pid]);if(!x)continue;tot+=x.min;if(x.st==='tit'){tit++;mt+=x.min}if(x.st==='sub'){sub++;msub+=x.min}if(x.st==='inf')inf++;if(x.st==='nd')nd++}const n=ms.length;const dur=S.settings.ref.dur||90;return {n,tot,tit,sub,mt,msub,inf,nd,util:n?tot/(n*dur)*100:null}}
function lastMatchPlayed(){const today=d2s(new Date());return playedMatches().filter(c=>c.date<=today).pop()||null}

/* ---------- velocità personali ---------- */
function hsrRel(e,frac){const P_=pb(e.p);if(!P_)return null;const thr=P_.v*frac;const bands=[[15,20,val(e,'d1520')],[20,25,num(e.v?.d2025)],[25,Math.max(P_.v,25.1),num(e.v?.d25)]];let s=0,any=false;for(const [a,b,v] of bands){if(v==null)continue;any=true;const f=Math.max(0,Math.min(1,(b-Math.max(a,thr))/(b-a)));s+=v*f}return any?s:null}

function alertsFor(wk){return memo('alerts:'+wk,()=>{
 const out=[...alertsForBase(wk)];const a=weekStart(wk),b=addDays(a,6);
 const wd=wellDates().filter(d=>d>=a&&d<=b);const lastD=wd[wd.length-1];
 if(lastD)for(const p of players()){const w=wellOf(p.id,lastD);if(w?.rec==null)continue;const base=recBase(p.id,lastD);const ac=acwr(p.id,wk);const heavy=(ac?.r!=null&&ac.r>1.3);
  if(w.rec<=S.settings.wellLow)out.push({sev:heavy?'hi':'md',p:p.id,t:`${p.name}: recupero “${REC_L[w.rec]}”`,d:`Wellness del ${dShort(lastD)}${heavy?` con ACWR ${fmt(ac.r,2)}: valuta di ridurre il carico.`:'.'}${base?` Sua media 28 gg: ${fmt(base,1)}.`:''}`});
  else if(base!=null&&w.rec<=base-1.2)out.push({sev:'lo',p:p.id,t:`${p.name}: recupero sotto la sua media`,d:`${w.rec} oggi contro ${fmt(base,1)} di media.`})}
 for(const i of activeInj()){const p=P(i.p);if(!p)continue;out.push({sev:i.status==='rtp'?'lo':'md',p:i.p,t:`${p.name}: ${i.status==='rtp'?'rientro, fase '+i.stage+' – '+(RTP[i.stage-1]?.l||''):'infortunato'}`,d:`${i.type||''}${i.site?' · '+i.site:''} dal ${dShort(i.date)} (${daysLost(i)} giorni)`})}
 for(const p of players()){const m=maturity(p.id);if(m.rate!=null&&m.rate>=S.settings.growthThr)out.push({sev:'md',p:p.id,t:`${p.name}: crescita rapida ${fmt(m.rate,1)} cm/anno`,d:'Fase di crescita veloce: attenzione a ginocchio, tallone e volumi di salto e sprint.'})}
 const o={hi:0,md:1,gd:2,lo:3};return out.sort((x,y)=>o[x.sev]-o[y.sev]);
})}

V3.report=()=>{
 const wk=S.ui.wk,pw=wk-1;const lm=lastMatchPlayed();const today=d2s(new Date());const next=calMatches().find(c=>c.date>=weekStart(wk));
 const ps=players();const unav=[],manage=[],ok=[];
 for(const p of ps){const inj=injuryInWeek(p.id,wk);const av=availOf(p.id,wk);const lw=wellDates().filter(d=>d<=addDays(weekStart(wk),6)).pop();const w=lw?wellOf(p.id,lw):null;const ac=acwr(p.id,pw);
  const why=[];if(inj&&inj.status!=='chiuso'){if(inj.status==='rtp'&&inj.stage>=3)why.push('rientro fase '+inj.stage);else{unav.push({p,why:(inj.type||'Infortunio')+(inj.site?' · '+inj.site:'')});continue}}

  if(av==='diff')why.push('differenziato');if(ac?.r!=null&&ac.r>1.3)why.push('ACWR '+fmt(ac.r,2));if(w?.rec!=null&&w.rec<=S.settings.wellLow)why.push('recupero basso');const m=maturity(p.id);if(m.rate!=null&&m.rate>=S.settings.growthThr)why.push('crescita rapida');
  (why.length?manage:ok).push({p,why:why.join(' · ')})}
 const g=teamWeek(pw);const keys=['dist','d2025','d25','acc3','dec3'];
 const comp=lm?ps.filter(p=>{const x=parseCode(lm.lineup?.[p.id]);return x&&['sub','pan'].includes(x.st)||(x&&x.st==='tit'&&x.min<45)}).map(p=>({p,x:parseCode(lm.lineup[p.id])})):[];
 const al=alertsFor(pw).filter(a=>a.sev==='hi'||a.sev==='md').slice(0,8);
 const tm=lm?teamMatch(lm):null;
 const plan=STD_WEEK.map(md=>({md,date:dateFor(wk,md),t:S.settings.plan[md]}));const refT=g.ref;
 const list=(arr,cls)=>arr.length?arr.map(x=>`<div class="who" style="padding:4px 0">${avatar(x.p,24)}<b style="font-size:12.5px">${esc(x.p.name)}</b>${x.why?`<span class="hint">· ${esc(x.why)}</span>`:''}</div>`).join(''):'<span class="hint">Nessuno</span>';

function refVal(r,k){if(!r)return null;if(k==='hid')return (r.acc3||0)+(r.dec3||0);if(k==='hsr')return (r.d2025||0)+(r.d25||0);return r[k]}
function reportWa(){const wk=S.ui.wk;const lm=lastMatchPlayed();const ps=players();const unav=[],man=[];for(const p of ps){const inj=injuryInWeek(p.id,wk);if(inj&&inj.status!=='chiuso'&&!(inj.status==='rtp'&&inj.stage>=3))unav.push(p.name);else{const ac=acwr(p.id,wk-1);if(availOf(p.id,wk)==='diff'||(ac?.r!=null&&ac.r>1.3))man.push(p.name)}}
 const g=teamWeek(wk-1);const t=`*${S.settings.team} · report ${dShort(weekStart(wk))}*\n${lm?`Ultima: ${lm.opp} ${lm.res||''}\n`:''}Distanza sett. scorsa: ${pctTxt(pctOf(g.total,g.ref,'dist'))} della partita\nIndisponibili: ${unav.join(', ')||'nessuno'}\nDa gestire: ${man.join(', ')||'nessuno'}`;return 'https://wa.me/?text='+encodeURIComponent(t)}

/* ---------- Piano vs reale ---------- */
const PLAN_K=[['dist','Distanza'],['d2025','20–25 km/h'],['d25','>25 km/h'],['hid','Acc+Dec >3']];
V3.plan=()=>{
 const wk=S.ui.wk,k=ui('plK','dist');const mds=[...new Set([...STD_WEEK,...weekEntries(wk).filter(e=>e.kind==='training').map(e=>e.md)])].sort((a,b)=>(MD_OFF[a]??3)-(MD_OFF[b]??3));
 const pc=v=>v==null?'none':v<80?'under':v>120?'over':'ok';
 const rows=players().filter(p=>reference(p.id,wk)).map(p=>{const r=refVal(reference(p.id,wk).v,k);const cells=mds.map(md=>{const es=trainings(p.id,wk).filter(e=>e.md===md);const tgt=(S.settings.plan[md]?.[k]??0)/100*r;const act=es.length?es.reduce((s,e)=>s+(val(e,k)||0),0):null;return {md,tgt,act,p:act!=null&&tgt?act/tgt*100:null}});const done=cells.filter(c=>c.act!=null);const tT=done.reduce((s,c)=>s+c.tgt,0),tA=done.reduce((s,c)=>s+c.act,0);return {p,cells,tT,tA,nd:done.length}});
 const tm=mds.map((md,i)=>({md,t:mean(rows.map(r=>r.cells[i].tgt)),a:mean(rows.filter(r=>r.cells[i].act!=null).map(r=>r.cells[i].act))}));
 return `<div class="row">${seg('plK',k,PLAN_K)}<span class="hint">Obiettivo di ogni seduta = % del piano × partita di riferimento del giocatore. Il piano si cambia in Impostazioni → Metodo.</span></div>
 <section class="card"><div class="card-h"><h2>Squadra: piano e reale per seduta</h2><span class="hint">media dei giocatori</span></div><div class="card-b">${groupedBars(tm.map(x=>x.md),[{name:'Piano',color:'var(--st-info)',vals:tm.map(x=>x.t)},{name:'Reale',color:'var(--accent)',vals:tm.map(x=>x.a)}])}${legend([['var(--st-info)','Piano'],['var(--accent)','Reale']])}</div></section>
 <section class="card"><div class="card-h"><h2>Per giocatore</h2>${legend([['var(--st-under)','sotto 80% del piano'],['var(--st-ok)','80–120%'],['var(--st-over)','oltre 120%']])}</div><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th>${mds.map(md=>`<th class="n">${md}<div class="hint" style="text-transform:none;letter-spacing:0">${dShort(dateFor(wk,md))}</div></th>`).join('')}<th class="n">Sedute fatte</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="name stick">${esc(r.p.name)}</td>${r.cells.map(c=>`<td class="n">${c.act!=null?`<span class="cell ${pc(c.p)}" data-tip="${esc(`Reale ${fmt(c.act)} · piano ${fmt(c.tgt)}`)}">${fmt(c.p,0)}%</span>`:`<span class="muted" data-tip="Obiettivo">${fmt(c.tgt)}</span>`}</td>`).join('')}<td class="n">${r.nd?`<span class="cell ${pc(r.tA/r.tT*100)}" data-tip="${esc(`Sedute fatte: ${r.nd} · reale ${fmt(r.tA)} su piano ${fmt(r.tT)}`)}">${fmt(r.tA/r.tT*100,0)}%</span> <span class="muted">${r.nd}/${r.cells.length}</span>`:'<span class="muted">–</span>'}</td></tr>`).join('')||`<tr><td colspan="${mds.length+2}"><div class="empty">Nessun giocatore con partita di riferimento.</div></td></tr>`}</tbody></table></div><div class="hint" style="padding:10px 14px">Numero grigio = obiettivo della seduta non ancora fatta (stesse unità del parametro).</div></div></section>`;
};
function groupedBars(labels,series){const W=900,H=220,L=50,R=10,T=10,B=28,iw=W-L-R,ih=H-T-B;const all=series.flatMap(s=>s.vals).filter(v=>v!=null);if(!all.length)return '<div class="empty">Nessun dato.</div>';const ym=niceMax(Math.max(...all)*1.05),gw=iw/labels.length,bw=Math.min(28,gw/(series.length+1));let g='';
 for(let i=0;i<=4;i++){const v=ym*i/4,y=T+ih-v/ym*ih;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
 labels.forEach((l,i)=>{const x0=L+i*gw+gw/2-bw*series.length/2;series.forEach((s,j)=>{const v=s.vals[i];if(v==null)return;const h=v/ym*ih;g+=`<rect x="${x0+j*bw+1}" y="${T+ih-h}" width="${bw-2}" height="${h}" rx="3" fill="${s.color}" data-tip="${esc(s.name+' '+l+': '+fmt(v))}"/>`});g+=`<text x="${L+i*gw+gw/2}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Piano e reale">${g}</svg>`}

function testColor(m,v,arr){if(v==null||arr.length<4)return '';const s=arr.slice().sort((a,b)=>a-b);const lo=quant(s,1/3),hi=quant(s,2/3);const good=m.lo?v<=lo:v>=hi,bad=m.lo?v>=hi:v<=lo;return good?'ok':bad?'over':'info'}

 const out=Object.keys(s.rows).filter(id=>P(id)?.role!=='PO');const cols=TM.filter(m=>s&&Object.values(s.rows).some(r=>tval(r,m)!=null));

 const ds=wellDates();if(!ds.length)return `<section class="card"><div class="empty"><b>Nessuna risposta</b>Collega il Google Form da “Collegamento Form”.</div></section>`;
 let d=ui('wDate',null);if(!ds.includes(d))d=ds[ds.length-1];
 const rows=players().map(p=>{const w=wellOf(p.id,d);const b=recBase(p.id,d);const prevD=ds.filter(x=>x<d).slice(-1)[0];return {p,w,b,mins:sessMin(p.id,d)}});
 const ans=rows.filter(r=>r.w?.rec!=null),miss=rows.filter(r=>r.w?.rec==null);const rpeN=rows.filter(r=>r.w?.rpe!=null).length;
 return `<div class="row">${flt('Giorno',`<select class="inp" data-uisel="wDate">${ds.slice().reverse().map(x=>`<option value="${x}" ${x===d?'selected':''}>${esc(dDow(x))} ${dShort(x)}</option>`).join('')}</select>`)}</div>
 <div class="kpis"><div class="kpi tone-acc"><span>Hanno risposto (wellness)</span><b>${ans.length}<small> / ${rows.length}</small></b></div><div class="kpi"><span>Recupero medio</span><b>${fmt(mean(ans.map(r=>r.w.rec)),1)}<small> / 5</small></b></div><div class="kpi ${ans.some(r=>r.w.rec<=S.settings.wellLow)?'tone-over':''}"><span>Recupero basso</span><b>${ans.filter(r=>r.w.rec<=S.settings.wellLow).length}</b><small>risposta ≤ ${S.settings.wellLow}</small></div><div class="kpi"><span>RPE inviati</span><b>${rpeN}</b></div></div>
 <section class="card"><div class="card-b flush"><div class="tw"><table class="t"><thead><tr><th class="stick">Giocatore</th><th>Recupero</th><th class="n">Media 28 gg</th><th class="n">Scarto</th><th class="n">RPE</th><th class="n">Minuti</th><th class="n">sRPE</th></tr></thead><tbody>${rows.map(r=>{const rec=r.w?.rec;const dlt=rec!=null&&r.b!=null?rec-r.b:null;const srpe=r.w?.rpe!=null&&r.mins?r.w.rpe*r.mins:null;return `<tr class="click" data-player="${r.p.id}"><td class="name stick">${esc(r.p.name)}</td><td>${rec==null?'<span class="muted">non ha risposto</span>':`<span class="chip ${recCls(rec)}">${rec} · ${REC_L[rec]}</span>`}</td><td class="n">${fmt(r.b,1)}</td><td class="n">${dlt==null?'–':`<span class="cell ${dlt<=-1.2?'over':dlt>=1?'ok':'info'}">${dlt>0?'+':''}${fmt(dlt,1)}</span>`}</td><td class="n">${r.w?.rpe??'–'}</td><td class="n">${fmt(r.mins)}</td><td class="n">${srpe==null?'–':`<span class="cell ${srpe>600?'over':srpe>=300?'info':'ok'}">${fmt(srpe)}</span>`}</td></tr>`}).join('')}</tbody></table></div><div class="hint" style="padding:10px 14px">Minuti: quelli GPS della seduta del giocatore, altrimenti i minuti di squadra del Google Sheet. sRPE colorato come nel tuo foglio: verde <300, neutro 300–600, rosso >600 UA.${miss.length?` · Senza wellness: ${miss.map(r=>esc(shortName(r.p.name))).join(', ')}`:''}</div></div></section>`;
};

async function syncGSheet(){
 S.ui.wSyncMsg='Leggo il Google Sheet…';render();
 let mcp=null;try{mcp=await window.claude?.use?.('mcp')}catch(e){}
 if(!mcp){S.ui.wSyncMsg='Collegamento ai connettori non disponibile in questa vista (apri l’app da claude.ai).';render();return}
 const G=S.settings.gsheet;
 try{
  const r=await mcp.callTool('Google Sheets','get_values',{spreadsheetId:G.id,range:String(G.range).replace(/!B2:F$/,'!A2:F')});const vals=(r.payload||{}).values||[];
  let mins=[];try{const r2=await mcp.callTool('Google Sheets','get_values',{spreadsheetId:G.id,range:G.mins});mins=(r2.payload||{}).values||[]}catch(e){}
  const res=applyFormRows(vals,mins);S.ui.wSyncMsg=`Fatto: ${res.w} wellness e ${res.r} RPE · ${res.skip} righe non riconosciute · ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`;
 }catch(e){S.ui.wSyncMsg={needs_reauth:'Ricollega Google Sheets in claude.ai → Impostazioni → Connettori.',server_not_connected:'Aggiungi il connettore Google Sheets in claude.ai → Impostazioni → Connettori.',not_in_manifest:'Hai negato l’accesso a Google Sheets per questa app: riattivalo dal menu Autorizzazioni dell’app.',approval_required:'Serve la tua autorizzazione: claude.ai la chiede quando apri l’app lì.',tool_error:'Google Sheets ha risposto con un errore: controlla l’ID del foglio.'}[e?.code]||('Non riuscito ('+(e?.code||'errore')+'). Riprova tra poco.')}
 render();
}
const MESI_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function isTsCell(c){c=String(c??'');return /^\d{1,2}\/\d{1,2}\/\d{4}\s+\d/.test(c)||/\d{4}\s+alle\s+ore/i.test(c)||/^\d{4}-\d\d-\d\d[T ]\d/.test(c)}
function tsDate(c){c=String(c??'');let m=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=normH(c).match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);if(m&&MESI_IT.includes(m[2]))return `${m[3]}-${String(MESI_IT.indexOf(m[2])+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=c.match(/^(\d{4})-(\d\d)-(\d\d)/);return m?`${m[1]}-${m[2]}-${m[3]}`:null}
function applyFormRows(vals,mins){let w=0,r=0,skip=0;const touched=new Set();const lo='2026-08-20',hi=d2s(new Date());
 for(let row of vals){if(!row||row.length<3)continue;let ts=null;if(isTsCell(row[0])){ts=tsDate(row[0]);row=row.slice(1)}const pid=nameMatch(row[0]);let d=seasonYearDate(row[1]);if(ts&&(!d||d<lo||d>hi||Math.abs(s2d(d)-s2d(ts))>3*864e5))d=ts;if(!pid||!d||d<lo||d>hi){skip++;continue}const wk=weekOfDate(d);const W=S.wellness[wk]=S.wellness[wk]||{wk,days:{},mins:{}};const o=(W.days[d]=W.days[d]||{})[pid]=W.days[d]?.[pid]||{};
  if(String(row[2]).startsWith('Wellness')&&row[3]){o.rec=parseInt(row[3]);w++}else if(String(row[2]).startsWith('RPE')&&row[4]){o.rpe=parseInt(row[4]);r++}touched.add(wk)}
 for(const m of mins){const d=seasonYearDate(m[0]);const v=num(m[1]);if(!d||v==null)continue;const wk=weekOfDate(d);const W=S.wellness[wk]=S.wellness[wk]||{wk,days:{},mins:{}};W.mins=W.mins||{};W.mins[d]=v;touched.add(wk)}
 touched.forEach(saveWell);invalidate();return {w,r,skip}}

function injCard(i){

 ${b?`<div class="tw"><table class="t"><thead><tr><th>Riferimento pre-infortunio (media per seduta, 4 sett.)</th>${K.map(k=>`<th class="n">${k[1]}</th>`).join('')}<th class="n">Vmax</th></tr></thead><tbody><tr><td class="muted">${b.n} sedute</td>${K.map(([k])=>`<td class="n">${fmt(b[k])}</td>`).join('')}<td class="n">${fmt(b.vmax,1)}</td></tr><tr><td><b>Obiettivo fase ${st.n}</b></td>${K.map(([k])=>`<td class="n">${fmt(b[k]*st.t[k]/100)} <span class="muted">${st.t[k]}%</span></td>`).join('')}<td></td></tr>
 ${post.map(e=>`<tr><td>${e.md} · ${dShort(e.date)}</td>${K.map(([k])=>{const v=val(e,k);const pc=v!=null&&b[k]?v/b[k]*100:null;return `<td class="n">${pc==null?'–':`<span class="cell ${pc<st.t[k]*.85?'under':pc>Math.max(st.t[k],10)*1.15?'over':'ok'}">${fmt(pc,0)}%</span>`}</td>`}).join('')}<td class="n">${fmt(val(e,'vmax'),1)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="hint">Nessuna seduta GPS nelle 4 settimane prima dell’infortunio: il rientro non ha un riferimento personale.</div>'}
 ${i.notes?`<div class="note">${esc(i.notes)}</div>`:''}</div></section>`;
}

V3.matur=()=>{
 const rows=players().map(p=>({p,m:maturity(p.id)}));const need=rows.filter(r=>!P(r.p.id).birth).length;
 const withOff=rows.filter(r=>r.m.off!=null).sort((a,b)=>a.m.off-b.m.off);
 const bench=rows.filter(r=>r.m.benchIssue).length;
 return `${bench?`<div class="note"><b>Altezza da seduto da correggere.</b> Nei test risulta in media il ${fmt(mean(rows.filter(r=>r.m.last?.sh).map(r=>r.m.last.sh/r.m.last.h*100)),0)}% della statura, mentre di norma è circa il 52%: il valore comprende quasi certamente l’altezza della panca su cui erano seduti. Inserisci l’altezza della panca usata e l’app la sottrae a tutte le misure: <span class="row" style="display:inline-flex;margin-left:6px"><input class="ni" data-setnum="benchCm" value="${S.settings.benchCm??''}" placeholder="es. 45"> cm</span></div>`:''}
 ${need?`<div class="note">Per calcolare la maturazione serve la <b>data di nascita</b>: inseriscila qui sotto (${need} giocatori senza). Le misure del 5 agosto sono già caricate dai test.</div>`:''}

function mcpMsg(e,server){return {needs_reauth:`Ricollega ${server} in claude.ai → Impostazioni → Connettori.`,server_not_connected:`Aggiungi il connettore ${server} in claude.ai → Impostazioni → Connettori.`,not_in_manifest:`Hai negato l’accesso a ${server} per questa app: riattivalo dal menu Autorizzazioni.`,approval_required:'Serve la tua autorizzazione: claude.ai la chiede quando apri l’app lì.',tool_error:`${server} ha risposto con un errore.`}[e?.code]||(`Non riuscito (${e?.code||'errore'}). Riprova tra poco.`)}
async function driveSearch(){const q=($('#drvQ')?.value||'').replace(/'/g,"\\'");S.ui.drv={q,msg:'Cerco…'};render();let mcp=null;try{mcp=await window.claude?.use?.('mcp')}catch(e){}if(!mcp){S.ui.drv.msg='Disponibile solo aprendo l’app da claude.ai.';render();return}
 try{const r=await mcp.callTool('Google Drive','search_files',{query:`title contains '${q}' and (mimeType = 'text/csv' or mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' or mimeType = 'application/vnd.google-apps.spreadsheet' or mimeType = 'application/vnd.ms-excel')`,pageSize:20,excludeContentSnippets:true});const files=((r.payload||{}).files||[]).sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||''));S.ui.drv={q,files,msg:files.length+' file'}}catch(e){S.ui.drv={q,msg:mcpMsg(e,'Google Drive')}}render()}
function findB64(o,depth=0){if(depth>6||o==null)return null;if(typeof o==='string')return o.length>40&&/^[A-Za-z0-9+/=\r\n_-]+$/.test(o.slice(0,200))?o:null;if(Array.isArray(o)){for(const x of o){const r=findB64(x,depth+1);if(r)return r}return null}if(typeof o==='object'){for(const k of ['content','data','base64','blob','fileContent','text']){if(o[k]!=null){const r=findB64(o[k],depth+1);if(r)return r}}for(const v of Object.values(o)){const r=findB64(v,depth+1);if(r)return r}}return null}
async function driveGet(id,mime){S.ui.drv={...S.ui.drv,msg:'Scarico il file…'};render();let mcp=null;try{mcp=await window.claude?.use?.('mcp')}catch(e){}if(!mcp)return;
 try{const native=mime==='application/vnd.google-apps.spreadsheet';const r=await mcp.callTool('Google Drive','download_file_content',native?{fileId:id,exportMimeType:'text/csv'}:{fileId:id});const b64=findB64(r.payload??r)||findB64(r.content);if(!b64)throw {code:'tool_error'};
  const bin=atob(b64.replace(/[\r\n]/g,'').replace(/-/g,'+').replace(/_/g,'/'));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(!native&&(mime.includes('sheet')||mime.includes('excel'))){await loadXLSX();const wb=XLSX.read(bytes,{type:'array'});loadImport(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}))}else loadImport(parseCSV(new TextDecoder('utf-8').decode(bytes)));
  S.ui.sub['dati.importa']='gps';S.ui.drv.msg='';render();toast('File letto: controlla l’anteprima e importa.')}catch(e){S.ui.drv={...S.ui.drv,msg:mcpMsg(e,'Google Drive')};render()}}

 const ps=players();const unav=ps.filter(p=>{const i=injuryInWeek(p.id,wk);return i&&i.status!=='chiuso'&&!(i.status==='rtp'&&i.stage>=3)});const man=ps.filter(p=>!unav.includes(p)&&(availOf(p.id,wk)==='diff'||(acwr(p.id,pw)?.r??0)>1.3));
 const big=(t,b)=>`<h2>${t}</h2><div class="pbody">${b}</div>`;const names=l=>l.length?`<div class="pnames">${l.map(p=>`<span>${avatar(p,44)}${esc(p.name)}</span>`).join('')}</div>`:'<p class="pmuted">Nessuno</p>';
 const pod=(k,l,u,d)=>{const r=ps.map(p=>{const v=weekEntries(pw).filter(e=>e.p===p.id).map(e=>val(e,k)).filter(x=>x!=null);return v.length?{p,v:k==='vmax'?Math.max(...v):v.reduce((a,b)=>a+b,0)}:null}).filter(Boolean).sort((a,b)=>b.v-a.v).slice(0,3);return `<div class="ppod"><h3>${l}</h3>${r.map((x,i)=>`<div>${['🥇','🥈','🥉'][i]} ${esc(x.p.name)} <b>${fmt(x.v,d)} ${u}</b></div>`).join('')}</div>`};
 return [
  `<div class="pcover"><img src="${document.querySelector('.brand-mark')?.src||''}" alt=""><h1>${esc(S.settings.team)}</h1><p>${esc(wkLabel(wk))}</p>${own.name?`<p class="pmuted">${esc(own.name)}${own.role?' · '+esc(own.role):''}</p>`:''}</div>`,
  big('Disponibilità',`<div class="pcols"><div><h3 style="color:var(--st-ok)">Disponibili · ${ps.length-unav.length-man.length}</h3></div><div><h3 style="color:var(--st-under)">Da gestire · ${man.length}</h3>${names(man)}</div><div><h3 style="color:var(--st-over)">Indisponibili · ${unav.length}</h3>${names(unav)}</div></div>`),
  big('Settimana scorsa',`<div class="pkpis">${['dist','d2025','d25','acc3','dec3'].map(k=>{const p=pctOf(g.total,g.ref,k);return `<div class="${status(k,p)}"><span>${esc(MK[k].l)}</span><b>${pctTxt(p)}</b><small>${fmtM(k,g.total?.[k])} ${MK[k].u}</small></div>`}).join('')}</div><p class="pmuted">% della partita di riferimento · ${esc(wkLabel(pw))}</p>`),
  lm?big(`Ultima partita · ${esc(lm.opp)} ${esc(lm.res||'')}`,`<div class="pkpis">${(()=>{const tm=teamMatch(lm);return tm?['dist','d2025','d25','acc3','vmax'].map(k=>`<div><span>${esc(MK[k].l)}</span><b>${fmtM(k,tm.v[k])}</b><small>${MK[k].u} media</small></div>`).join(''):''})()}</div><p class="pmuted">${ps.filter(p=>parseCode(lm.lineup?.[p.id])?.st==='tit').length} titolari · ${ps.filter(p=>parseCode(lm.lineup?.[p.id])?.st==='sub').length} subentrati</p>`):'',
  big('Da tenere d’occhio',alertsFor(pw).filter(a=>a.sev==='hi'||a.sev==='md').slice(0,6).map(a=>`<div class="palert"><i class="sev ${a.sev}"></i><div><b>${esc(a.t)}</b><p>${esc(a.d)}</p></div></div>`).join('')||'<p class="pmuted">Nessun avviso.</p>'),
  big('Piano della settimana',`<table class="ptable"><tr><th></th>${PLAN_K.map(([,l])=>`<th>${l}</th>`).join('')}</tr>${STD_WEEK.map(md=>`<tr><td><b>${md}</b> <span class="pmuted">${esc(dDow(dateFor(wk,md)))}</span></td>${PLAN_K.map(([k])=>`<td>${g.ref?fmt((S.settings.plan[md]?.[k]||0)/100*refVal(g.ref,k)):'–'}</td>`).join('')}</tr>`).join('')}</table>`),
  big('Podio della settimana',`<div class="pcols">${pod('dist','Distanza','m',0)}${pod('d25','Sprint >25 km/h','m',0)}${pod('vmax','Velocità massima','km/h',1)}</div>`),
 ].filter(Boolean)}
function present(){const sl=presSlides();let i=0;const el=document.createElement('div');el.className='pres';
 const draw=()=>{el.innerHTML=`<div class="pslide">${sl[i]}</div><div class="pbar"><span>${esc(S.settings.team)} · Eleven Lab</span><span>${i+1} / ${sl.length}</span><span><button data-pp="-1">‹</button><button data-pp="1">›</button><button data-pp="x">Esci</button></span></div>`};
 const key=e=>{if(e.key==='ArrowRight'||e.key===' '){i=Math.min(sl.length-1,i+1);draw()}else if(e.key==='ArrowLeft'){i=Math.max(0,i-1);draw()}else if(e.key==='Escape')close()};
 const close=()=>{document.removeEventListener('keydown',key);el.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(_){}};
 el.addEventListener('click',e=>{const b=e.target.closest('[data-pp]');if(!b)return;if(b.dataset.pp==='x')close();else{i=Math.max(0,Math.min(sl.length-1,i+ +b.dataset.pp));draw()}});
 document.addEventListener('keydown',key);draw();document.body.appendChild(el);try{el.requestFullscreen?.().catch(()=>{})}catch(_){}}

 if(d.att){const [pid,date,k]=d.att.split('|');const wk=weekOfDate(date);const W=S.wellness[wk]=S.wellness[wk]||{wk,days:{},mins:{}};const o=(W.days[date]=W.days[date]||{})[pid]=W.days[date][pid]||{};o.att=o.att===k?undefined:k;if(!o.att)delete o.att;saveWell(wk);render();return}

SUBS['partite.calendario']=[['stagione','Stagione'],['tabella','Modifica in tabella']];
const TEAM_SHORT=()=>(S.settings.team||'Südtirol').replace(/\s*U\s?1\d\b/i,'').replace(/^FC\s+/i,'').trim()||'Südtirol';
/* risultato scritto casa–ospite (come sui comunicati): in trasferta i gol del Südtirol sono il secondo numero */
function matchScore(c){const m=String(c?.res||'').match(/(\d+)\s*[-–:]\s*(\d+)/);if(!m)return null;const a=+m[1],b=+m[2];const away=c.venue==='Trasferta';const gf=away?b:a,ga=away?a:b;return {a,b,gf,ga,o:gf>ga?'V':gf<ga?'P':'N'}}
const OUT_CL={V:'ok',N:'under',P:'over'},OUT_L={V:'Vittoria',N:'Pareggio',P:'Sconfitta'};
function seasonRecord(list){const r={g:0,V:0,N:0,P:0,gf:0,ga:0,pts:0,form:[]};for(const c of list){const s=matchScore(c);if(!s||c.comp&&c.comp!=='Campionato')continue;r.g++;r[s.o]++;r.gf+=s.gf;r.ga+=s.ga;r.pts+=s.o==='V'?3:s.o==='N'?1:0;r.form.push({o:s.o,c})}return r}
function matchEntriesOf(c){return allEntries().filter(e=>e.kind==='match'&&(e.gid===c.id||(!e.gid&&e.date===c.date)))}
function sides(c){const us=TEAM_SHORT(),them=c.opp||'Avversario';return c.venue==='Trasferta'?[them,us,false]:[us,them,true]}
function scoreHtml(c,big){const s=matchScore(c);const [h,a,usHome]=sides(c);const cls=big?'ms-big':'ms';return `<div class="${cls}"><span class="${usHome?'us':''}">${esc(h)}</span><b class="${s?OUT_CL[s.o]:'tbd'}">${s?`${s.a}<i>–</i>${s.b}`:'vs'}</b><span class="${usHome?'':'us'}">${esc(a)}</span></div>`}
function formChips(r,n=5){return r.form.slice(-n).map(f=>`<span class="fchip ${OUT_CL[f.o]}" data-tip="${esc(f.c.opp)} ${esc(f.c.res)}" data-mopen="${f.c.id}">${f.o}</span>`).join('')}

const V5={};
V5.calendario=()=>{if(S.ui.match&&S.calendar.matches?.[S.ui.match])return V5.matchSheet(S.calendar.matches[S.ui.match]);
 if(sub('partite.calendario')==='tabella')return subSeg('partite.calendario')+VIEWS.calendar();
 const cal=calMatches();const today=d2s(new Date());
 if(!cal.length)return subSeg('partite.calendario')+`<div class="card"><div class="empty"><b>Calendario vuoto</b>Aggiungi le partite da “Modifica in tabella”.</div></div>`;
 const played=cal.filter(c=>matchScore(c));const r=seasonRecord(played);const nx=cal.find(c=>c.date>=today&&!matchScore(c));
 const xg=played.filter(c=>c.tac?.xgF!=null);const xgF=xg.reduce((s,c)=>s+num(c.tac.xgF),0),xgA=xg.reduce((s,c)=>s+num(c.tac.xgA||0),0);
 const home=seasonRecord(played.filter(c=>c.venue==='Casa')),away=seasonRecord(played.filter(c=>c.venue==='Trasferta'));
 // elenco per mese, con le domeniche senza partita tra la prima e l'ultima giornata
 const byDate=Object.fromEntries(cal.map(c=>[c.date,c]));const rows=[];let lastM='';
 const sundays=[];if(cal[0]?.date){let d=s2d(cal[0].date);while(d.getDay()!==0)d.setDate(d.getDate()+1);const end=s2d(cal[cal.length-1].date);for(;d<=end;d.setDate(d.getDate()+7))sundays.push(d2s(d))}
 const dates=[...new Set([...cal.map(c=>c.date),...sundays])].sort();
 for(const ds of dates){const mo=MONTHS_L[s2d(ds).getMonth()]+' '+s2d(ds).getFullYear();if(mo!==lastM){rows.push(`<div class="cal-month">${esc(mo)}</div>`);lastM=mo}
  const c=byDate[ds];if(!c){const near=cal.some(x=>Math.abs(s2d(x.date)-s2d(ds))<4*864e5);if(!near)rows.push(`<div class="cal-gap"><span>${dDow(ds)} ${dShort(ds)}</span>nessuna partita · riposo o sosta</div>`);continue}
  rows.push(calRow(c,today,c===nx))}
 return `${subSeg('partite.calendario')}
 <div class="kpis">
  <div class="kpi tone-acc"><span>Classifica punti</span><b>${r.pts}<small> pt</small></b><small>${r.g} giocate · ${fmt(r.g?r.pts/r.g:null,2)} a partita</small></div>
  <div class="kpi"><span>Vinte · pari · perse</span><b>${r.V}<small>·</small>${r.N}<small>·</small>${r.P}</b><small>casa ${home.V}-${home.N}-${home.P} · trasferta ${away.V}-${away.N}-${away.P}</small></div>
  <div class="kpi"><span>Gol fatti · subiti</span><b>${r.gf}<small>–</small>${r.ga}</b><small>differenza ${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</small></div>
  <div class="kpi"><span>Forma ultime 5</span><div class="frow">${formChips(r)||'<span class="muted">–</span>'}</div><small>${xg.length?`xG ${fmt(xgF,1)} fatti · ${fmt(xgA,1)} subiti (${xg.length} part.)`:'xG: inseriscili nella scheda partita'}</small></div>
 </div>
 ${nx?`<section class="hero cal-next" data-mopen="${nx.id}"><div><span class="eyebrow">Prossima · G${nx.g??''} · tra ${Math.round((s2d(nx.date)-s2d(today))/864e5)} giorni</span>${scoreHtml(nx,true)}<span class="hint">${dDow(nx.date)} ${dShort(nx.date)}${nx.time?' · ore '+esc(nx.time):''} · ${esc(nx.venue||'')}${nx.field?' · '+esc(nx.field):''}</span></div>${prevMeet(nx)}</section>`:''}
 <section class="card"><div class="card-h"><h2>Calendario ${esc(S.settings.season||'')}</h2><span class="sub">Tocca una partita per aprire la scheda con dati GPS, minutaggio e dati tattici. Risultato scritto casa–ospite.</span></div><div class="card-b cal-list">${rows.join('')}</div></section>`};
function teamKey(n){return normH(n).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!['fc','ac','as','us','ssc','lr','l','r','calcio','hellas','1913','1907'].includes(w)).join(' ')}
function sameTeam(a,b){const x=teamKey(a),y=teamKey(b);return !!x&&!!y&&(x===y||x.includes(y)||y.includes(x))}
function prevMeet(nx){const pm=calMatches().find(c=>c.id!==nx.id&&matchScore(c)&&sameTeam(c.opp,nx.opp));if(!pm)return '';const s=matchScore(pm);return `<div class="cal-prev"><span class="tag">Andata</span> ${esc(pm.res)} <span class="chip ${OUT_CL[s.o]}">${OUT_L[s.o]}</span>${pm.tac?.xgF!=null?`<span class="hint">xG ${fmt(num(pm.tac.xgF),1)}–${fmt(num(pm.tac.xgA),1)}</span>`:''}</div>`}
function calRow(c,today,isNext){const s=matchScore(c);const tm=teamMatch(c);const lu=c.lineup?Object.values(c.lineup).map(parseCode).filter(Boolean):[];const used=lu.filter(x=>x.min>0).length;const past=c.date<today;
 const badges=[tm?`<span class="tag acc" data-tip="${tm.src==='auto'?tm.n+' giocatori con GPS':'Valori di squadra inseriti a mano'}">GPS</span>`:'',lu.length?`<span class="tag" data-tip="${used} giocatori utilizzati">Minuti</span>`:'',c.tac&&Object.keys(c.tac).length?`<span class="tag match">Tattica</span>`:''].join('');
 return `<button type="button" class="cal-row${isNext?' next':''}${!past&&!s?' fut':''}" data-mopen="${c.id}"><span class="cal-g">G${c.g??''}</span><span class="cal-d"><b>${dShort(c.date)}</b><small>${dDow(c.date)}${c.time?' '+esc(c.time):''}</small></span><span class="tag ${c.venue==='Casa'?'acc':''} cal-v">${c.venue==='Casa'?'Casa':c.venue==='Trasferta'?'Trasf.':esc(c.venue||'')}</span>${scoreHtml(c)}<span class="cal-o">${s?`<span class="chip ${OUT_CL[s.o]}">${OUT_L[s.o]}</span>`:''}</span><span class="cal-k">${tm?`<span><small>Dist</small>${fmt(tm.v.dist)}</span><span><small>&gt;25</small>${fmt(tm.v.d25)}</span>`:''}${c.tac?.xgF!=null?`<span><small>xG</small>${fmt(num(c.tac.xgF),1)}–${fmt(num(c.tac.xgA),1)}</span>`:''}</span><span class="cal-b">${badges}</span></button>`}

V5.matchSheet=c=>{const cal=calMatches();const i=cal.findIndex(x=>x.id===c.id);const pv=cal[i-1],nx=cal[i+1];const s=matchScore(c);const tm=teamMatch(c);
 const others=cal.filter(x=>x.id!==c.id&&teamMatch(x));const avg=others.length?meanTotals(others.map(x=>teamMatch(x).v)):null;
 const K=['dist','dpm','d2025','d25','acc3','dec3','vmax'];
 const ents=matchEntriesOf(c);const ids=new Set([...ents.map(e=>e.p),...Object.keys(c.lineup||{}).filter(p=>parseCode(c.lineup[p]))]);
 const rows=[...ids].filter(P).map(p=>{const e=ents.find(x=>x.p===p);const x=parseCode(c.lineup?.[p]);return {p,e,x,min:x?.min??(e?val(e,'min'):0)}}).sort((a,b)=>(b.min||0)-(a.min||0)||(ROLES.findIndex(r=>r.id===P(a.p).role)-ROLES.findIndex(r=>r.id===P(b.p).role)));
 const best={};for(const k of K){const vs=rows.map(r=>r.e?val(r.e,k):null).filter(v=>v!=null);if(vs.length)best[k]=Math.max(...vs)}

 return `<div class="row" style="gap:8px"><button class="btn sm" data-mback="1">← Calendario</button><span style="flex:1"></span>${pv?`<button class="btn sm ghost" data-mopen="${pv.id}">‹ G${pv.g??''} ${esc(pv.opp)}</button>`:''}${nx?`<button class="btn sm ghost" data-mopen="${nx.id}">G${nx.g??''} ${esc(nx.opp)} ›</button>`:''}</div>
 <section class="hero ms-hero"><span class="eyebrow">${esc(c.comp||'Campionato')} · giornata ${c.g??'–'} · ${dDow(c.date)} ${dShort(c.date)}${c.time?' · ore '+esc(c.time):''}</span>${scoreHtml(c,true)}<div class="row" style="justify-content:center;gap:8px">${s?`<span class="chip ${OUT_CL[s.o]}">${OUT_L[s.o]}</span>`:'<span class="chip info">Da giocare</span>'}<span class="tag ${c.venue==='Casa'?'acc':''}">${esc(c.venue||'')}</span>${c.field?`<span class="hint">${esc(c.field)}</span>`:''}</div></section>

 },fail));

async function boot(){
 try{const th=localStorage.getItem('loadlab-theme');if(th)document.documentElement.dataset.theme=th;if(localStorage.getItem('loadlab-motion'))document.body.classList.add('reduce');S.season=localStorage.getItem('el-season')||null}catch(e){}
 try{const u=JSON.parse(localStorage.getItem('loadlab-ui')||'null');if(u){let v=u.view;if(u.tabs)Object.assign(S.ui.tabs,u.tabs);if(ROUTES[v]){const [pg,tb,sb]=ROUTES[v];v=pg;if(tb)S.ui.tabs[pg]=tb;if(sb)S.ui.sub[pg+'.'+tb]=sb}if(PAGES[v])S.ui.view=v;if(MODES[u.mode])S.ui.mode=u.mode;S.ui.player=u.player||null;S.ui.entryMode=u.entryMode||'player';if(u.sub)Object.assign(S.ui.sub,u.sub)}}catch(e){}
 const h=location.hash.slice(1);if(PAGES[h])S.ui.view=h;
 S.ui.wk=Math.max(0,todayWeek());render();
 let db=null;try{db=window.claude?.use?await window.claude.use('db'):null}catch(e){db=null}
 if(!db){S.local=true;localLoad();applySeasonRecord();chooseWeek();_weekChosen=true;$('#dbState').textContent='Dati salvati su questo dispositivo';setSaveUI();render();return}
 S.db=db;$('#dbState').textContent='Archivio online collegato';
 try{const user=await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false){S.readOnly=true;document.body.classList.add('ro')}}}catch(e){}
 const fail=err=>{$('#dbState').textContent=(err?.code==='revoked'||err?.code==='not_granted')?'Archivio non disponibile':'Archivio in pausa, riprovo…'};
 let first=true;
 db.collection('app').onSnapshot(snap=>{
  for(const doc of snap.docs){const path='app/'+doc.id;if(busy(path))continue;const d=clone(doc.data());if(doc.id==='config')S.settings=mergeSettings(d);else if(doc.id==='roster')S.roster={players:d.players||{}};else if(doc.id==='tests')S.tests={sessions:d.sessions||{}};else if(doc.id==='anthro')S.anthro={items:d.items||{}};else if(doc.id==='injuries')S.injuries={items:d.items||{}}}
  applySeasonRecord();S.loaded.app=true;invalidate();if(first){first=false;subscribeSeason()}scheduleRender();
 },fail);
 db.collection('notes').onSnapshot(snap=>{S.notes={items:{}};for(const doc of snap.docs)S.notes.items[doc.id]={id:doc.id,...clone(doc.data())};invalidate();scheduleRender()},fail);
 db.collection('photos').onSnapshot(snap=>{S.photos={};for(const doc of snap.docs)S.photos[doc.id]=doc.data().d;invalidate();scheduleRender()},fail);
}
function applySeasonRecord(){if(!S.season||!S.settings.seasons?.[S.season])S.season=S.settings.seasons?.[S.settings.curSeason]?S.settings.curSeason:LEGACY_SEASON;const r=S.settings.seasons?.[seasonId()];if(r){S.settings.season=r.label;S.settings.seasonStart=r.start}applyAccent()}
boot();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
