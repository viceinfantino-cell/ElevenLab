document.addEventListener('dragover',e=>{const dz=e.target.closest?.('#xlDrop');if(dz){e.preventDefault();dz.classList.add('over')}});
document.addEventListener('drop',e=>{const dz=e.target.closest?.('#xlDrop');if(!dz)return;e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readXl(f)});
async function readXl(f){if(/\.numbers$/i.test(f.name)){toast('Da Numbers: File → Esporta in → Excel, poi carica il file .xlsx.');return}try{S.ui.xl=await parseLoadLabFile(f);if(!S.ui.xl.sed.length&&!S.ui.xl.ros.length)toast('Non trovo i fogli Sedute/Rosa: usa il file scaricato dall’app.');render()}catch(err){toast('Non riesco a leggere il file Excel.')}}
document.addEventListener('click',e=>{if(innerWidth<=900&&$('#side').classList.contains('open')&&!e.target.closest('#side')&&!e.target.closest('#menuBtn'))$('#side').classList.remove('open')});

/* ================= AVVIO ================= */
function chooseWeek(){const ws=weeksWithData();const tw=todayWeek();if(!ws.length){S.ui.wk=Math.max(0,tw);return}S.ui.wk=ws.includes(tw)?tw:(ws.filter(w=>w<=tw).pop()??ws[ws.length-1])}
let _weekChosen=false;
let _subs=[];
function subscribeSeason(){
 _subs.forEach(u=>{try{u()}catch(e){}});_subs=[];const db=S.db;if(!db)return;
 S.weeks={};S.wellness={};S.calendar={matches:{}};invalidate();
 const fail=err=>{$('#dbState').textContent=(err?.code==='revoked'||err?.code==='not_granted')?'Archivio non disponibile':'Archivio in pausa, riprovo…'};
 const W=coll('weeks'),WL=coll('wellness');
 _subs.push(db.collection(W).onSnapshot(snap=>{
  for(const ch of snap.docChanges()){const path=W+'/'+ch.doc.id;if(busy(path))continue;if(ch.type==='removed'){const wk=Object.keys(S.weeks).find(k=>wkPath(+k)===path);if(wk!=null)delete S.weeks[wk]}else{const d=clone(ch.doc.data());const wk=d.wk??parseInt(ch.doc.id.slice(1));S.weeks[wk]={...d,wk,entries:d.entries||{}}}}
  S.loaded.weeks=true;invalidate();if(!_weekChosen&&S.loaded.app){chooseWeek();_weekChosen=true}scheduleRender();
 },fail));
 _subs.push(db.collection(WL).onSnapshot(snap=>{for(const ch of snap.docChanges()){const path=WL+'/'+ch.doc.id;if(busy(path))continue;const d=clone(ch.doc.data()||{});const wk=d.wk??parseInt(ch.doc.id.slice(1));if(ch.type==='removed')delete S.wellness[wk];else S.wellness[wk]={wk,days:d.days||{},mins:d.mins||{}}}invalidate();scheduleRender()},fail));
 _subs.push(db.doc('app/'+calDoc()).onSnapshot(doc=>{if(busy('app/'+calDoc()))return;S.calendar={matches:(doc.exists?doc.data().matches:null)||{}};invalidate();scheduleRender()},fail));
}
async function flushAll(){for(const t of SAVE.timers.values())clearTimeout(t);await Promise.all([...SAVE.pending.keys()].map(p=>flush(p)));if(S.local)localSave()}
async function switchSeason(id){await flushAll();S.season=id;try{localStorage.setItem('el-season',id)}catch(e){}const r=S.settings.seasons?.[id];if(r){S.settings.season=r.label;S.settings.seasonStart=r.start}_weekChosen=false;if(S.db)subscribeSeason();else{localLoad();applySeasonRecord()}chooseWeek();render()}
async function boot(){
 try{const th=localStorage.getItem('loadlab-theme');if(th)document.documentElement.dataset.theme=th;if(localStorage.getItem('loadlab-motion'))document.body.classList.add('reduce');S.season=localStorage.getItem('el-season')||null}catch(e){}
 try{const u=JSON.parse(localStorage.getItem('loadlab-ui')||'null');if(u){let v=u.view;if(u.tabs)Object.assign(S.ui.tabs,u.tabs);if(ROUTES[v]){const [pg,tb,sb]=ROUTES[v];v=pg;if(tb)S.ui.tabs[pg]=tb;if(sb)S.ui.sub[pg+'.'+tb]=sb}if(PAGES[v])S.ui.view=v;if(MODES[u.mode])S.ui.mode=u.mode;S.ui.player=u.player||null;S.ui.entryMode=u.entryMode||'player';if(u.sub)Object.assign(S.ui.sub,u.sub)}}catch(e){}
 const h=location.hash.slice(1);if(PAGES[h])S.ui.view=h;
 S.ui.wk=Math.max(0,todayWeek());render();
 let db=null;try{db=window.claude?.use?await window.claude.use('db'):null}catch(e){db=null}
 if(!db){S.local=true;localLoad();applySeasonRecord();chooseWeek();_weekChosen=true;$('#dbState').textContent='Dati salvati su questo dispositivo';setSaveUI();render();return}
 S.db=db;$('#dbState').textContent='Archivio online collegato';
 try{const user=await window.claude.use('user');if(user){const c=await user.can('data.write');if(c===false){S.readOnly=true;document.body.classList.add('ro')}}}catch(e){}
 const fail=err=>{$('#dbState').textContent=(err?.code==='revoked'||err?.code==='not_granted')?'Archivio non disponibile':'Archivio in pausa, riprovo…'};
 let first=true;
 db.collection('app').onSnapshot(snap=>{
  for(const doc of snap.docs){const path='app/'+doc.id;if(busy(path))continue;const d=clone(doc.data());if(doc.id==='config')S.settings=mergeSettings(d);else if(doc.id==='roster')S.roster={players:d.players||{}};else if(doc.id==='tests')S.tests={sessions:d.sessions||{}};else if(doc.id==='anthro')S.anthro={items:d.items||{}};else if(doc.id==='injuries')S.injuries={items:d.items||{}}}
  applySeasonRecord();S.loaded.app=true;invalidate();if(first){first=false;subscribeSeason()}scheduleRender();
 },fail);
 db.collection('notes').onSnapshot(snap=>{S.notes={items:{}};for(const doc of snap.docs)S.notes.items[doc.id]={id:doc.id,...clone(doc.data())};invalidate();scheduleRender()},fail);
 db.collection('photos').onSnapshot(snap=>{S.photos={};for(const doc of snap.docs)S.photos[doc.id]=doc.data().d;invalidate();scheduleRender()},fail);
}
function applySeasonRecord(){if(!S.season||!S.settings.seasons?.[S.season])S.season=S.settings.seasons?.[S.settings.curSeason]?S.settings.curSeason:LEGACY_SEASON;const r=S.settings.seasons?.[seasonId()];if(r){S.settings.season=r.label;S.settings.seasonStart=r.start}applyAccent()}
boot();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
